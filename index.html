function montarCamposForm(mov, editId){
  const wrap = document.getElementById('formFields');
  const e = editId ? state.entries.find(x=>x.id===editId) : null;
  const hoje = new Date().toISOString().slice(0,10);
  const cats = categoriasParaMovimento(mov);
  const formasOpts = state.formas.map(f=>`<option value="${f.nome}" ${e&&e.formaPagamento===f.nome?'selected':''}>${f.nome}</option>`).join('');
  const fornecedoresOpts = `<option value="">—</option>` + state.fornecedores.map(f=>`<option value="${f.nome}" ${e&&e.fornecedor===f.nome?'selected':''}>${f.nome}</option>`).join('');
  const clientesOpts = `<option value="">—</option>` + state.clientes.map(c=>`<option value="${c.nome}" ${e&&e.cliente===c.nome?'selected':''}>${c.nome}</option>`).join('');
  const contaOptsReais = (sel)=> state.contas.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${c.nome}</option>`).join('');
  const contaOpts = (sel)=> contaOptsReais(sel)
    + `<option value="${CONTA_NAO_CLASSIFICADO}" ${sel===CONTA_NAO_CLASSIFICADO?'selected':''}>— Não classificado —</option>`;

  if(mov==='transferencia'){
    wrap.innerHTML = `
      <div class="field"><label>Data</label><input type="date" id="fData" value="${e?e.data:hoje}" required></div>
      <div class="field"><label>Conta de origem</label><select id="fContaOrigem">${contaOptsReais(e?e.contaOrigem:(state.contas[0]?state.contas[0].id:''))}</select></div>
      <div class="field"><label>Conta de destino</label><select id="fContaDestino">${contaOptsReais(e?e.contaDestino:(state.contas[1]?state.contas[1].id:(state.contas[0]?state.contas[0].id:'')))}</select></div>
      <div class="field span-2"><label>Descrição</label><input type="text" id="fDescricao" placeholder="Ex: Depósito do caixa no banco" value="${e?e.descricao||'':''}"></div>
      <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" min="0" id="fValor" value="${e?e.valor:''}" required></div>
    `;
  } else {
    const isEntrada = mov==='entrada';
    wrap.innerHTML = `
      <div class="field"><label>Data</label><input type="date" id="fData" value="${e?e.data:hoje}" required></div>
      <div class="field"><label>Categoria</label><select id="fCategoria" required>${cats.map(c=>`<option value="${c}" ${e&&e.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" min="0" id="fValor" value="${e?e.valor:''}" required></div>
      <div class="field span-2"><label>Descrição</label><input type="text" id="fDescricao" placeholder="Detalhe do lançamento" value="${e?e.descricao||'':''}"></div>
      <div class="field"><label>Conta ${isEntrada?'de destino (onde entrou o dinheiro)':'de origem (de onde saiu)'}</label><select id="fConta">${contaOpts(e?e.conta:(state.contas[0]?state.contas[0].id:''))}</select></div>
      <div class="field"><label>Forma de pagamento</label><select id="fFormaPagamento">${formasOpts}</select></div>
      <div class="field"><label>Status</label>
        <select id="fStatus">
          <option value="OK" ${e&&e.status==='OK'?'selected':''}>OK</option>
          <option value="Aguardando" ${e&&e.status==='Aguardando'?'selected':''}>Aguardando</option>
          <option value="Parcelado" ${e&&e.status==='Parcelado'?'selected':''}>Parcelado</option>
        </select>
      </div>
      ${isEntrada ? `<div class="field span-2"><label>Cliente (opcional)</label><select id="fCliente">${clientesOpts}</select></div>`
                  : `<div class="field span-2"><label>Fornecedor (opcional)</label><select id="fFornecedor">${fornecedoresOpts}</select></div>`}
    `;
  }

  const form = document.getElementById('lancForm');
  form.onsubmit = async (ev)=>{
    ev.preventDefault();
    const id = document.getElementById('editId').value || uid();
    let novo;
    if(mov==='transferencia'){
      novo = {
        id, movimento:'transferencia',
        data: document.getElementById('fData').value,
        contaOrigem: document.getElementById('fContaOrigem').value,
        contaDestino: document.getElementById('fContaDestino').value,
        descricao: document.getElementById('fDescricao').value,
        valor: parseFloat(document.getElementById('fValor').value)||0,
      };
      if(novo.contaOrigem === novo.contaDestino){ toast('Escolha contas diferentes para a transferência.'); return; }
    } else {
      novo = {
        id, movimento: mov,
        data: document.getElementById('fData').value,
        categoria: document.getElementById('fCategoria').value,
        descricao: document.getElementById('fDescricao').value,
        valor: parseFloat(document.getElementById('fValor').value)||0,
        conta: document.getElementById('fConta').value,
        formaPagamento: document.getElementById('fFormaPagamento').value,
        status: document.getElementById('fStatus').value,
        fornecedor: mov==='saida' ? (document.getElementById('fFornecedor')?document.getElementById('fFornecedor').value:'') : '',
        cliente: mov==='entrada' ? (document.getElementById('fCliente')?document.getElementById('fCliente').value:'') : '',
      };
    }
    const idx = state.entries.findIndex(x=>x.id===id);
    if(idx>=0) state.entries[idx] = novo; else state.entries.push(novo);
    await persistEntries();
    toastSuccess(editId ? 'Lançamento atualizado com sucesso!' : 'Lançamento salvo com sucesso!');
    fecharFormLanc();
    atualizarListaLanc();
  };
}

/* ================= VIEW: MENSAL ================= */
let chartMensal = null;
let chartVendasDia = null;
let chartDespesaPct = null;
let mensalFiltroVendasAberto = false;

function vendasNoPeriodo(inicio, fim){
  return state.entries.filter(e=>{
    if(e.movimento!=='entrada') return false;
    if(!e.categoria || !e.categoria.startsWith('Vendas')) return false;
    if(inicio && e.data < inicio) return false;
    if(fim && e.data > fim) return false;
    return true;
  }).reduce((a,e)=>a+Number(e.valor||0),0);
}

function vendasPorDiaNoMes(ano, mes){
  const ultimoDia = new Date(ano, mes+1, 0).getDate();
  const totais = new Array(ultimoDia).fill(0);
  state.entries.forEach(e=>{
    if(e.movimento!=='entrada') return;
    if(!e.categoria || !e.categoria.startsWith('Vendas')) return;
    if(entryYear(e)!==ano || entryMonth(e)!==mes) return;
    const dia = parseInt(e.data.slice(8,10), 10);
    totais[dia-1] += Number(e.valor||0);
  });
  return totais;
}

function renderMensal(){
  const anos = anosDisponiveis();
  const ano = state.mensalAno || Math.max(...anos);
  state.mensalAno = ano;
  const mes = state.mensalMes;

  document.getElementById('topbarActions').innerHTML = `
    <select id="selMensalAno" class="mono" style="padding:8px 12px; border-radius:3px; border:1.5px solid var(--paper-edge); font-weight:700; margin-right:8px;">
      ${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}
    </select>
    <select id="selMensalMes" style="padding:8px 12px; border-radius:3px; border:1.5px solid var(--paper-edge); font-weight:700;">
      ${MESES.map((m,i)=>`<option value="${i}" ${i===mes?'selected':''}>${m}</option>`).join('')}
    </select>
  `;

  const entradasMes = state.entries.filter(e=> e.movimento==='entrada' && entryYear(e)===ano && entryMonth(e)===mes);
  const saidasMes = state.entries.filter(e=> e.movimento==='saida' && entryYear(e)===ano && entryMonth(e)===mes);

  const porCategoria = (list)=>{
    const map = {};
    list.forEach(e=>{ map[e.categoria] = (map[e.categoria]||0) + Number(e.valor||0); });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  };

  const hoje = new Date().toISOString().slice(0,10);
  const filtroVD = state.filtroVendasDia;
  const filtroVDAtivo = !!(filtroVD.inicio && filtroVD.fim);
  const totalVendasPeriodo = filtroVDAtivo ? vendasNoPeriodo(filtroVD.inicio, filtroVD.fim) : vendasNoPeriodo(hoje, hoje);
  const labelVendasPeriodo = filtroVDAtivo
    ? `Vendas de ${formatDateBR(filtroVD.inicio)} até ${formatDateBR(filtroVD.fim)}`
    : `Vendas de hoje — ${formatDateBR(hoje)}`;

  // Cards de resumo do topo (Entradas/Saídas/Saldo do Mês) sempre seguem o seletor de Mês/Ano,
  // independente do filtro de período do card de Vendas do Dia.
  const totalEntMes = entradasMes.reduce((a,e)=>a+Number(e.valor||0),0);
  const totalSaiMes = saidasMes.reduce((a,e)=>a+Number(e.valor||0),0);

  // Painéis "Entradas por categoria" / "Saídas por categoria": quando o filtro de período de
  // vendas está ativo, passam a considerar só os lançamentos dentro desse intervalo de datas
  // (em vez do mês inteiro). Sem filtro ativo, comportamento igual ao de sempre (mês/ano do topo).
  const entradasCat = filtroVDAtivo
    ? state.entries.filter(e=> e.movimento==='entrada' && e.data >= filtroVD.inicio && e.data <= filtroVD.fim)
    : entradasMes;
  const saidasCatRaw = filtroVDAtivo
    ? state.entries.filter(e=> e.movimento==='saida' && e.data >= filtroVD.inicio && e.data <= filtroVD.fim)
    : saidasMes;
  // Só entram categorias oficiais de despesa (state.categorias.saidas) — lançamentos antigos que
  // têm nome de fornecedor no campo categoria não aparecem mais aqui, mas continuam contando
  // normalmente no total de Despesas/Lucro Líquido em outros lugares do sistema.
  const saidasCat = saidasCatRaw.filter(e=> state.categorias.saidas.includes(e.categoria));

  const entCatArr = porCategoria(entradasCat);
  const saiCatArr = porCategoria(saidasCat);
  const totalEntCat = entCatArr.reduce((a,[,v])=>a+v,0);
  const totalSaiCat = saiCatArr.reduce((a,[,v])=>a+v,0);
  const periodoCatLabel = filtroVDAtivo ? `${formatDateBR(filtroVD.inicio)} a ${formatDateBR(filtroVD.fim)}` : '';

  // "Vendas por dia" e "Maiores saídas do mês" (abaixo) NÃO são afetados pelo filtro de período —
  // continuam sempre baseados no mês/ano selecionado no topo.
  const vendasDiaArr = vendasPorDiaNoMes(ano, mes);
  const totalVendasMes = vendasDiaArr.reduce((a,b)=>a+b,0);
  const saiCatArrMes = porCategoria(saidasMes);

  // Gráfico de % de cada categoria de despesa sobre o faturamento (Ajuste 5): mesma fonte de
  // dados que o painel "Saídas por categoria" (respeita o filtro de período), agrupando
  // "Insumos Lanchonete" + "Insumos Produção" numa única barra "CMV".
  const CMV_CATEGORIAS = ['Insumos Lanchonete', 'Insumos Produção'];
  let cmvTotal = 0;
  const despesaPctBase = [];
  saiCatArr.forEach(([cat, v])=>{
    if(CMV_CATEGORIAS.includes(cat)) cmvTotal += v;
    else despesaPctBase.push([cat, v]);
  });
  if(cmvTotal > 0) despesaPctBase.push(['CMV', cmvTotal]);
  despesaPctBase.sort((a,b)=> b[1]-a[1]);
  const despesaPctArr = despesaPctBase.map(([cat,v])=> ({ cat, pct: totalEntCat>0 ? (v/totalEntCat*100) : 0 }));

  if(isMobileViewport()){
    document.getElementById('content').innerHTML = renderMensalMobileHTML({
      ano, mes, totalEntMes, totalSaiMes, filtroVD, filtroVDAtivo, totalVendasPeriodo, labelVendasPeriodo,
      entCatArr, saiCatArr, totalEntCat, totalSaiCat, periodoCatLabel, vendasDiaArr, totalVendasMes,
      saiCatArrMes, despesaPctArr
    });
    wireMensalMobileEvents({ ano, mes });
    return;
  }

  document.getElementById('content').innerHTML = `
    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="card">
        <div class="card-icon icon-green"><svg viewBox="0 0 24 24"><path d="M4 16l6-6 4 4 6-7"/><path d="M14 7h6v6"/></svg></div>
        <div class="stat-label">Entradas — ${MESES[mes]}</div>
        <div class="stat-value" style="color:var(--green);">${formatBRL(totalEntMes)}</div>
      </div>
      <div class="card">
        <div class="card-icon icon-red"><svg viewBox="0 0 24 24"><path d="M4 8l6 6 4-4 6 7"/><path d="M14 17h6v-6"/></svg></div>
        <div class="stat-label">Saídas — ${MESES[mes]}</div>
        <div class="stat-value" style="color:var(--red);">${formatBRL(totalSaiMes)}</div>
      </div>
      <div class="card tone-total">
        <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/></svg></div>
        <div class="stat-label">Saldo do Mês</div>
        <div class="stat-value">${formatBRL(totalEntMes-totalSaiMes)}</div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-head">
        <div>
          <div class="card-icon icon-green" style="margin-bottom:10px;"><svg viewBox="0 0 24 24"><path d="M4 16l6-6 4 4 6-7"/><path d="M14 7h6v6"/></svg></div>
          <div class="stat-label">${labelVendasPeriodo}</div>
          <div class="stat-value" style="color:var(--green); font-size:27px;">${formatBRL(totalVendasPeriodo)}</div>
        </div>
        <div class="actions">
          <button class="btn btn-outline btn-sm" id="btnToggleFiltroVendasDia">Filtrar período</button>
        </div>
      </div>
      <div class="filter-bar" id="painelFiltroVendasDia" style="display:${(mensalFiltroVendasAberto||filtroVDAtivo)?'flex':'none'};">
        <div class="field">
          <label>Data inicial</label>
          <input type="date" id="fVendasDiaInicio" value="${filtroVD.inicio||''}">
        </div>
        <div class="field">
          <label>Data final</label>
          <input type="date" id="fVendasDiaFim" value="${filtroVD.fim||''}">
        </div>
        <button class="btn btn-primary btn-sm" id="btnAplicarFiltroVendasDia">Aplicar</button>
        <button class="btn btn-outline btn-sm" id="btnLimparFiltroVendasDia">Limpar</button>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="panel">
        <div class="panel-head">
          <h3>Entradas por categoria</h3>
          ${periodoCatLabel? `<span class="mini-note" style="margin:0;">${periodoCatLabel}</span>`:''}
        </div>
        ${entCatArr.length? entCatArr.map(([cat,v])=>`
          <div class="ticket-line"><span class="lbl">${cat}</span><span class="dots"></span><span class="val pos">${formatBRL(v)}</span></div>
        `).join('') : `<div class="empty-state"><div class="ico">◇</div>Nenhuma entrada ${filtroVDAtivo?'neste período':'neste mês'}</div>`}
        ${entCatArr.length? `<div class="ticket-line ticket-total"><span class="lbl">Total</span><span class="dots"></span><span class="val pos">${formatBRL(totalEntCat)}</span></div>`:''}
      </div>
      <div class="panel">
        <div class="panel-head">
          <h3>Saídas por categoria</h3>
          ${periodoCatLabel? `<span class="mini-note" style="margin:0;">${periodoCatLabel}</span>`:''}
        </div>
        ${saiCatArr.length? saiCatArr.map(([cat,v])=>`
          <div class="ticket-line"><span class="lbl">${cat}</span><span class="dots"></span><span class="val neg">${formatBRL(v)}</span></div>
        `).join('') : `<div class="empty-state"><div class="ico">◇</div>Nenhuma saída ${filtroVDAtivo?'neste período':'neste mês'}</div>`}
        ${saiCatArr.length? `<div class="ticket-line ticket-total"><span class="lbl">Total</span><span class="dots"></span><span class="val neg">${formatBRL(totalSaiCat)}</span></div>`:''}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Despesas em % do faturamento</h3>
        ${periodoCatLabel? `<span class="mini-note" style="margin:0;">${periodoCatLabel}</span>`:''}
      </div>
      <div class="chart-box small" id="boxDespesaPct"><canvas id="canvasDespesaPct"></canvas></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Vendas por dia — ${MESES[mes]}</h3></div>
      <div class="chart-box small" id="boxVendasDia"><canvas id="canvasVendasDia"></canvas></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Maiores saídas do mês</h3></div>
      <div class="chart-box small" id="boxMensal"><canvas id="canvasMensal"></canvas></div>
    </div>
  `;

  document.getElementById('selMensalAno').addEventListener('change', e=>{ state.mensalAno = Number(e.target.value); renderMensal(); });
  document.getElementById('selMensalMes').addEventListener('change', e=>{ state.mensalMes = Number(e.target.value); renderMensal(); });

  document.getElementById('btnToggleFiltroVendasDia').addEventListener('click', ()=>{
    mensalFiltroVendasAberto = !mensalFiltroVendasAberto;
    renderMensal();
  });
  document.getElementById('btnAplicarFiltroVendasDia').addEventListener('click', ()=>{
    const inicio = document.getElementById('fVendasDiaInicio').value;
    const fim = document.getElementById('fVendasDiaFim').value;
    if(!inicio || !fim){ toast('Selecione a data inicial e a data final para aplicar o filtro.'); return; }
    state.filtroVendasDia = inicio <= fim ? { inicio, fim } : { inicio: fim, fim: inicio };
    mensalFiltroVendasAberto = true;
    renderMensal();
  });
  document.getElementById('btnLimparFiltroVendasDia').addEventListener('click', ()=>{
    state.filtroVendasDia = { inicio:'', fim:'' };
    mensalFiltroVendasAberto = false;
    renderMensal();
  });

  if(!totalVendasMes){
    chartEmptyState('boxVendasDia', 'Nenhuma venda registrada neste mês.');
  } else {
    ensureChartLib().then(()=>{
      try{
        const ctx = document.getElementById('canvasVendasDia');
        if(!ctx) return;
        if(chartVendasDia) chartVendasDia.destroy();
        chartVendasDia = new Chart(ctx, {
          type:'bar',
          data:{
            labels: vendasDiaArr.map((_,i)=> String(i+1)),
            datasets:[{ data: vendasDiaArr, backgroundColor:'#2E8F5B', borderRadius:5, maxBarThickness:22 }]
          },
          options:{
            responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{display:false},
              tooltip:{ backgroundColor:'#1D2420', padding:10, cornerRadius:8, callbacks:{ label:(c)=> ` ${formatBRL(c.parsed.y)}` } } },
            scales:{
              y:{ ticks:{ callback:(v)=>'R$ '+v.toLocaleString('pt-BR'), font:{family:'Plus Jakarta Sans'} }, grid:{color:'#EEF0EA'} },
              x:{ grid:{display:false}, ticks:{font:{family:'Plus Jakarta Sans', size:11}} }
            }
          }
        });
        requestAnimationFrame(()=>{ try{ chartVendasDia && chartVendasDia.resize(); }catch(e){} });
      } catch(e){
        console.error('Falha ao criar gráfico de vendas por dia:', e);
        chartEmptyState('boxVendasDia', 'Não foi possível carregar o gráfico agora.');
      }
    }).catch((err)=>{
      console.error('Não foi possível carregar a biblioteca de gráficos:', err);
      chartEmptyState('boxVendasDia', 'Não foi possível carregar a biblioteca de gráficos.');
    });
  }

  if(!despesaPctArr.length || totalEntCat<=0){
    chartEmptyState('boxDespesaPct', totalEntCat<=0 && despesaPctArr.length ? 'Sem faturamento no período para calcular o percentual.' : `Nenhuma despesa registrada ${filtroVDAtivo?'neste período':'neste mês'}.`);
  } else {
    ensureChartLib().then(()=>{
      try{
        const ctx = document.getElementById('canvasDespesaPct');
        if(!ctx) return;
        if(chartDespesaPct) chartDespesaPct.destroy();
        chartDespesaPct = new Chart(ctx, {
          type:'bar',
          data:{
            labels: despesaPctArr.map(d=> `${d.cat} — ${d.pct.toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})}%`),
            datasets:[{ data: despesaPctArr.map(d=>d.pct), backgroundColor:'#D6483D', borderRadius:5, maxBarThickness:22 }]
          },
          options:{
            indexAxis:'y', responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{display:false},
              tooltip:{ backgroundColor:'#1D2420', padding:10, cornerRadius:8, callbacks:{ label:(c)=> ` ${c.parsed.x.toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})}%` } } },
            scales:{
              x:{ ticks:{ callback:(v)=>v.toLocaleString('pt-BR')+'%', font:{family:'Plus Jakarta Sans'} }, grid:{color:'#EEF0EA'} },
              y:{ grid:{display:false}, ticks:{font:{family:'Plus Jakarta Sans', size:12}} }
            }
          }
        });
        requestAnimationFrame(()=>{ try{ chartDespesaPct && chartDespesaPct.resize(); }catch(e){} });
      } catch(e){
        console.error('Falha ao criar gráfico de despesas em % do faturamento:', e);
        chartEmptyState('boxDespesaPct', 'Não foi possível carregar o gráfico agora.');
      }
    }).catch((err)=>{
      console.error('Não foi possível carregar a biblioteca de gráficos:', err);
      chartEmptyState('boxDespesaPct', 'Não foi possível carregar a biblioteca de gráficos.');
    });
  }

  const top = saiCatArrMes.slice(0,8);
  if(!top.length){
    chartEmptyState('boxMensal', 'Nenhuma saída registrada neste mês.');
  } else {
    ensureChartLib().then(()=>{
      try{
        const ctx = document.getElementById('canvasMensal');
        if(!ctx) return;
        if(chartMensal) chartMensal.destroy();
        chartMensal = new Chart(ctx, {
          type:'bar',
          data:{ labels: top.map(([c])=>c), datasets:[{ data: top.map(([,v])=>v), backgroundColor:'#C97F1E', borderRadius:5, maxBarThickness:22 }] },
          options:{
            indexAxis:'y', responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{display:false},
              tooltip:{ backgroundColor:'#1D2420', padding:10, cornerRadius:8, callbacks:{ label:(c)=> ` ${formatBRL(c.parsed.x)}` } } },
            scales:{ x:{ ticks:{ callback:(v)=>'R$ '+v.toLocaleString('pt-BR'), font:{family:'Plus Jakarta Sans'} }, grid:{color:'#EEF0EA'} }, y:{ grid:{display:false}, ticks:{font:{family:'Plus Jakarta Sans', size:12}} } }
          }
        });
        requestAnimationFrame(()=>{ try{ chartMensal && chartMensal.resize(); }catch(e){} });
      } catch(e){
        console.error('Falha ao criar gráfico mensal:', e);
        chartEmptyState('boxMensal', 'Não foi possível carregar o gráfico agora.');
      }
    }).catch((err)=>{
      console.error('Não foi possível carregar a biblioteca de gráficos:', err);
      chartEmptyState('boxMensal', 'Não foi possível carregar a biblioteca de gráficos.');
    });
  }
}

/* ================= VIEW: DASHBOARD ================= */
let chartAnual = null;
let chartCategorias = null;
let chartVendasCat = null;

function iconAccountSVG(tipo){
  if(tipo==='especie'){

function chartEmptyState(boxId, mensagem){
  const box = document.getElementById(boxId);
  if(!box) return;
  box.innerHTML = `<div class="empty-state"><div class="ico"><svg viewBox="0 0 24 24"><path d="M4 19V9"/><path d="M11 19V5"/><path d="M18 19v-7"/></svg></div>${mensagem}</div>`;
}

function renderChartAnual(resumo){
  const semDados = resumo.totalEnt.every(v=>v===0) && resumo.totalSai.every(v=>v===0);
  if(semDados){ chartEmptyState('boxAnual', 'Nenhum lançamento encontrado neste ano.'); return; }
  try{
    const ctx = document.getElementById('canvasAnual');
    if(chartAnual) chartAnual.destroy();
    chartAnual = new Chart(ctx, {
      type:'bar',
      data:{
        labels: MESES_ABBR,
        datasets:[
          {label:'Entradas', data:resumo.totalEnt, backgroundColor:'#2E8F5B', borderRadius:6, maxBarThickness:30},
          {label:'Saídas', data:resumo.totalSai, backgroundColor:'#D6483D', borderRadius:6, maxBarThickness:30}
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{ mode:'index', intersect:false },
        plugins:{
          legend:{ position:'bottom', labels:{font:{family:'Plus Jakarta Sans', size:12}, usePointStyle:true, boxWidth:8} },
          tooltip:{ backgroundColor:'#1D2420', padding:10, cornerRadius:8, titleFont:{family:'Plus Jakarta Sans', weight:'700'}, bodyFont:{family:'Plus Jakarta Sans'},
            callbacks:{ label:(c)=> ` ${c.dataset.label}: ${formatBRL(c.parsed.y)}` } }
        },
        scales:{
          y:{ ticks:{ callback:(v)=>'R$ '+v.toLocaleString('pt-BR'), font:{family:'Plus Jakarta Sans'} }, grid:{color:'#EEF0EA'} },
          x:{ grid:{display:false}, ticks:{font:{family:'Plus Jakarta Sans'}} }
        }
      }
    });
    requestAnimationFrame(()=>{ try{ chartAnual && chartAnual.resize(); }catch(e){} });
  } catch(e){
    console.error('Falha ao criar gráfico anual:', e);
    chartEmptyState('boxAnual', 'Não foi possível carregar o gráfico agora.');
  }
}

function renderChartVendasCategoria(resumo){
  let vendasCats = Object.entries(resumo.entPorCat)
    .map(([cat,arr])=>({ cat, soma: arr.reduce((a,b)=>a+b,0) }))
    .filter(c=>c.soma>0);
  const somenteVendas = vendasCats.filter(c=>c.cat.startsWith('Vendas'));
  if(somenteVendas.length) vendasCats = somenteVendas;
  vendasCats.sort((a,b)=> b.soma-a.soma);

  if(vendasCats.length===0){ chartEmptyState('boxVendasCat', 'Nenhuma venda registrada neste ano.'); return; }

  const palette = ['#2E8F5B','#3B7DB8','#E8A33D','#7C6FD1','#2E9C96','#D6483D','#C97F1E'];
  try{
    const ctx = document.getElementById('canvasVendasCat');
    if(chartVendasCat) chartVendasCat.destroy();
    const totalVendas = vendasCats.reduce((a,c)=>a+c.soma,0);
    chartVendasCat = new Chart(ctx, {
      type:'doughnut',
      data:{
        labels: vendasCats.map(c=>c.cat),
        datasets:[{
          data: vendasCats.map(c=>c.soma),
          backgroundColor: vendasCats.map((c,i)=>palette[i%palette.length]),
          borderWidth:3, borderColor:'#fff', hoverOffset:6
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{
          legend:{ position:'bottom', labels:{font:{family:'Plus Jakarta Sans', size:11.5}, usePointStyle:true, boxWidth:8, padding:12} },
          tooltip:{ backgroundColor:'#1D2420', padding:10, cornerRadius:8,
            callbacks:{ label:(c)=> ` ${c.label}: ${formatBRL(c.parsed)} (${((c.parsed/totalVendas)*100).toFixed(1)}%)` } }
        }
      }
    });
    requestAnimationFrame(()=>{ try{ chartVendasCat && chartVendasCat.resize(); }catch(e){} });
  } catch(e){
    console.error('Falha ao criar gráfico de vendas por categoria:', e);
    chartEmptyState('boxVendasCat', 'Não foi possível carregar o gráfico agora.');
  }
}

function renderChartCategorias(resumo){
  const catTotals = [];
  Object.entries(resumo.entPorCat).forEach(([cat,arr])=>{
    const soma = arr.reduce((a,b)=>a+b,0);
    if(soma>0) catTotals.push({ cat, soma, tipo:'entrada' });
  });
  Object.entries(resumo.saiPorCat).forEach(([cat,arr])=>{
    const soma = arr.reduce((a,b)=>a+b,0);
    if(soma>0) catTotals.push({ cat, soma, tipo:'saida' });
  });
  catTotals.sort((a,b)=> b.soma - a.soma);

  if(catTotals.length===0){ chartEmptyState('boxCategorias', 'Nenhum lançamento encontrado neste ano.'); return; }

  try{
    const ctxCat = document.getElementById('canvasCategorias');
    if(chartCategorias) chartCategorias.destroy();
    chartCategorias = new Chart(ctxCat, {
      type:'bar',
      data:{
        labels: catTotals.map(c=>c.cat),
        datasets:[{
          data: catTotals.map(c=>c.soma),
          backgroundColor: catTotals.map(c=> c.tipo==='entrada' ? '#2E8F5B' : '#D6483D'),
          borderRadius:5,
          maxBarThickness:22
        }]
      },
      options:{
        indexAxis:'y',
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ display:false },
          valueLabelsPlugin:{ enabled:true },
          tooltip:{ backgroundColor:'#1D2420', padding:10, cornerRadius:8,
            callbacks:{ label:(c)=> ` ${formatBRL(c.parsed.x)}` } }
        },
        layout:{ padding:{ right:70 } },
        scales:{
          x:{ ticks:{ callback:(v)=>'R$ '+v.toLocaleString('pt-BR'), font:{family:'Plus Jakarta Sans'} }, grid:{color:'#EEF0EA'} },
          y:{ grid:{display:false}, ticks:{font:{family:'Plus Jakarta Sans', size:12}} }
        }
      }
    });
    requestAnimationFrame(()=>{ try{ chartCategorias && chartCategorias.resize(); }catch(e){} });
  } catch(e){
    console.error('Falha ao criar gráfico de categorias:', e);
    chartEmptyState('boxCategorias', 'Não foi possível carregar o gráfico agora.');
  }
}

function tabelaConsolidadaHTML(resumo){
  const entCats = Object.keys(resumo.entPorCat);
  const saiCats = Object.keys(resumo.saiPorCat);
  let rows = '';
  entCats.forEach(cat=>{
    const arr = resumo.entPorCat[cat];
    const soma = arr.reduce((a,b)=>a+b,0);
    if(soma===0) return;
    rows += `<tr><td>${cat}</td>${arr.map(v=>`<td class="num">${v?formatNum(v):'—'}</td>`).join('')}<td class="num" style="font-weight:700;">${formatNum(soma)}</td></tr>`;
  });
  rows += `<tr style="background:var(--green-soft);"><td style="font-weight:800;">Total Entradas</td>${resumo.totalEnt.map(v=>`<td class="num" style="font-weight:800;">${formatNum(v)}</td>`).join('')}<td class="num" style="font-weight:800;">${formatNum(resumo.totalEnt.reduce((a,b)=>a+b,0))}</td></tr>`;

  saiCats.forEach(cat=>{
    const arr = resumo.saiPorCat[cat];
    const soma = arr.reduce((a,b)=>a+b,0);
    if(soma===0) return;
    rows += `<tr><td>${cat}</td>${arr.map(v=>`<td class="num">${v?formatNum(v):'—'}</td>`).join('')}<td class="num" style="font-weight:700;">${formatNum(soma)}</td></tr>`;
  });
  rows += `<tr style="background:var(--red-soft);"><td style="font-weight:800;">Total Saídas</td>${resumo.totalSai.map(v=>`<td class="num" style="font-weight:800;">${formatNum(v)}</td>`).join('')}<td class="num" style="font-weight:800;">${formatNum(resumo.totalSai.reduce((a,b)=>a+b,0))}</td></tr>`;

  const saldoMes = resumo.totalEnt.map((v,i)=>v-resumo.totalSai[i]);
  rows += `<tr style="background:var(--ink); color:#fff;"><td style="font-weight:800;">Saldo do Mês</td>${saldoMes.map(v=>`<td class="num" style="font-weight:800; color:#fff;">${formatNum(v)}</td>`).join('')}<td class="num" style="font-weight:800; color:#fff;">${formatNum(saldoMes.reduce((a,b)=>a+b,0))}</td></tr>`;

  return `<table class="data"><thead><tr><th>Categoria</th>${MESES_ABBR.map(m=>`<th style="text-align:right;">${m}</th>`).join('')}<th style="text-align:right;">Total</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ================= CÁLCULOS AGREGADOS ================= */
function entryYear(e){ return parseInt(e.data.slice(0,4)); }
function entryMonth(e){ return parseInt(e.data.slice(5,7)) - 1; }
function entryDay(e){ return e.data; }

function saldosPorConta(){
  const saldo = {};
  state.contas.forEach(c=> saldo[c.id] = 0);
  state.entries.forEach(e=>{
    const v = Number(e.valor)||0;
    if(e.movimento==='entrada'){
      if(e.conta===CONTA_NAO_CLASSIFICADO) return;
      saldo[e.conta] = (saldo[e.conta]||0) + v;
    } else if(e.movimento==='saida'){
      if(e.conta===CONTA_NAO_CLASSIFICADO) return;
      saldo[e.conta] = (saldo[e.conta]||0) - v;
    } else if(e.movimento==='transferencia'){
      if(e.contaOrigem===CONTA_NAO_CLASSIFICADO || e.contaDestino===CONTA_NAO_CLASSIFICADO) return;
      saldo[e.contaOrigem] = (saldo[e.contaOrigem]||0) - v;
      saldo[e.contaDestino] = (saldo[e.contaDestino]||0) + v;
    }
  });
  return saldo;
}

function totalGeral(saldo){ return Object.values(saldo).reduce((a,b)=>a+(b||0),0); }

function anosDisponiveis(){
  const anos = new Set(state.entries.map(entryYear));
  anos.add(new Date().getFullYear());
  return Array.from(anos).sort();
}

function resumoAnual(ano){
  // returns {entradasPorCatPorMes, saidasPorCatPorMes, totalEntradasMes[12], totalSaidasMes[12]}
  const entCats = state.categorias.entradas;
  const saiCats = state.categorias.saidas;
  const entPorCat = {}; entCats.forEach(c=> entPorCat[c] = new Array(12).fill(0));
  const saiPorCat = {}; saiCats.forEach(c=> saiPorCat[c] = new Array(12).fill(0));
  const totalEnt = new Array(12).fill(0);
  const totalSai = new Array(12).fill(0);

  state.entries.forEach(e=>{
    if(entryYear(e) !== ano) return;
    const m = entryMonth(e);
    const v = Number(e.valor)||0;
    if(e.movimento==='entrada'){
      if(!entPorCat[e.categoria]) entPorCat[e.categoria] = new Array(12).fill(0);
      entPorCat[e.categoria][m] += v;
      totalEnt[m] += v;
    } else if(e.movimento==='saida'){
      if(!saiPorCat[e.categoria]) saiPorCat[e.categoria] = new Array(12).fill(0);
      saiPorCat[e.categoria][m] += v;
      totalSai[m] += v;
    }
  });

  return { entPorCat, saiPorCat, totalEnt, totalSai };
}

function contagemVendas({dia, mes, ano}){
  // conta lançamentos de entrada cuja categoria começa com "Vendas"
  return state.entries.filter(e=>{
    if(e.movimento!=='entrada') return false;
    if(!e.categoria || !e.categoria.startsWith('Vendas')) return false;
    if(dia && e.data !== dia) return false;
    if(mes!==undefined && mes!==null && mes!=='' ){
      if(entryMonth(e) !== Number(mes)) return false;
    }
    if(ano && entryYear(e) !== Number(ano)) return false;
    return true;
  }).length;
