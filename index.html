<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Lanchonete Central — Painel de Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Chart.js é carregado dinamicamente pelo próprio script, com espera garantida (ver ensureChartLib) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #F4F5F2;
    --surface: #FFFFFF;
    --surface-2: #F8F9F6;
    --border: #E6E8E2;
    --border-strong: #D8DBD3;
    --ink: #1D2420;
    --ink-soft: #545E56;
    --muted: #8B948B;

    --brand: #E8A33D;
    --brand-dark: #C67F1E;
    --brand-soft: #FBEDD3;

    --green: #2E8F5B;
    --green-soft: #E2F3E9;
    --red: #D6483D;
    --red-soft: #FBE5E2;
    --blue: #3B7DB8;
    --blue-soft: #E4EFF8;
    --purple: #7C6FD1;
    --purple-soft: #ECE9FB;
    --teal: #2E9C96;
    --teal-soft: #DEF3F1;

    --side-bg: #16231D;
    --side-bg-active: #1F3128;
    --side-border: #253A30;
    --side-text: #A9B8AE;
    --side-text-active: #FFFFFF;

    --r-sm: 8px;
    --r: 12px;
    --r-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(20,30,20,.05), 0 1px 1px rgba(20,30,20,.03);
    --shadow: 0 6px 20px rgba(20,30,20,.08);
    --shadow-lg: 0 20px 45px rgba(20,30,20,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-variant-numeric:tabular-nums;}
  .display{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800;}
  .num-cell{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:#B9BEB2;}

  svg.icon{ width:18px; height:18px; flex-shrink:0; }
  svg.icon path, svg.icon circle, svg.icon line, svg.icon rect, svg.icon polyline{
    stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round;
  }

  /* ================= LOGIN / SETUP ================= */
  #authScreen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(232,163,61,.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(46,143,91,.12), transparent 45%),
      var(--side-bg);
    z-index:100; padding:20px;
  }
  .ticket{
    background:var(--surface);
    width:100%; max-width:400px;
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-lg);
    padding:38px 34px 30px;
  }
  .ticket-brand{ text-align:center; margin-bottom:4px; }
  .ticket-logo{
    width:52px; height:52px; border-radius:14px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--brand), var(--brand-dark)); box-shadow:var(--shadow);
  }
  .ticket-logo svg{ width:26px; height:26px; }
  .ticket-logo svg path{ stroke:#fff; }
  .ticket-brand .eyebrow{
    display:block; font-size:11px; letter-spacing:2.5px; color:var(--muted); text-transform:uppercase; margin-bottom:6px; font-weight:700;
  }
  .ticket-brand h1{
    font-family:'Plus Jakarta Sans',sans-serif; font-size:26px; margin:0; color:var(--ink); line-height:1.1; font-weight:800; letter-spacing:.3px;
  }
  .ticket-brand .sub{ font-size:13px; color:var(--muted); margin-top:8px; }
  .ticket-divider{ border:none; border-top:1px solid var(--border); margin:24px 0 20px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:7px; font-weight:600; }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 13px; border:1.5px solid var(--border-strong); border-radius:var(--r-sm);
    background:var(--surface); font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft);
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 18px; border-radius:var(--r-sm); border:none; cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:13.5px;
    transition:transform .1s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--brand); color:#2A1B00; box-shadow:0 2px 8px rgba(232,163,61,.35); }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-block{ width:100%; }
  .btn-outline{ background:var(--surface); border:1.5px solid var(--border-strong); color:var(--ink); }
  .btn-outline:hover{ border-color:var(--ink-soft); background:var(--surface-2); }
  .btn-danger{ background:var(--red); color:#fff; }
  .btn-danger:hover{ background:#B93B31; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); padding:8px 10px; font-weight:600; }
  .btn-ghost:hover{ color:var(--ink); background:var(--surface-2); }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:8px; }
  .btn svg.icon{ width:15px; height:15px; }
  .auth-error{ color:var(--red); font-size:12.5px; margin-top:8px; display:none; font-weight:600; }
  .auth-note{ font-size:11.5px; color:var(--muted); margin-top:18px; line-height:1.55; text-align:center; }

  /* ================= APP SHELL ================= */
  #app{ display:none; min-height:100vh; }
  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:236px; flex-shrink:0; background:var(--side-bg);
    display:flex; flex-direction:column; padding:20px 14px;
    position:sticky; top:0; height:100vh;
  }
  .sidebar .brand{ padding:6px 10px 20px; margin-bottom:10px; display:flex; align-items:center; gap:11px; }
  .sidebar .brand .logo-badge{
    width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, var(--brand), var(--brand-dark));
    display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .sidebar .brand .logo-badge svg{ width:19px; height:19px; }
  .sidebar .brand .logo-badge svg path{ stroke:#2A1B00; }
  .sidebar .brand-text .eyebrow{ color:var(--brand); font-size:9.5px; letter-spacing:2px; text-transform:uppercase; font-weight:800; display:block; }
  .sidebar .brand-text h1{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; color:#fff; font-size:15px; margin:2px 0 0; line-height:1.15; }

  .navlist{ list-style:none; padding:0; margin:0; flex:1; display:flex; flex-direction:column; gap:2px; }
  .navlist li{ list-style:none; }
  .navlist button{
    width:100%; text-align:left; background:none; border:none; color:var(--side-text); cursor:pointer;
    padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:600; font-family:'Plus Jakarta Sans',sans-serif;
    display:flex; align-items:center; gap:11px; position:relative; transition:background .15s ease, color .15s ease;
  }
  .navlist button:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .navlist button.active{ background:var(--side-bg-active); color:var(--side-text-active); }
  .navlist button.active svg.icon path{ stroke:var(--brand); }
  .navlist button svg.icon{ width:18px; height:18px; }

  .sidebar-footer{ padding-top:14px; border-top:1px solid var(--side-border); margin-top:10px; }
  .sidebar-footer .who{ font-size:11.5px; color:#7E9188; margin-bottom:8px; display:flex; align-items:center; gap:6px; padding:0 10px;}
  .sidebar-footer button{ width:100%; justify-content:flex-start; padding-left:10px; }

  .main{ flex:1; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 32px; background:var(--bg);
    position:sticky; top:0; z-index:5;
  }
  .topbar h2{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:21px; margin:0; color:var(--ink); letter-spacing:-.2px; }
  .topbar .today{ font-size:12.5px; color:var(--muted); margin-top:3px; text-transform:capitalize; }
  .content{ padding:0 32px 60px; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  /* ---------- Cards / grids ---------- */
  .grid{ display:grid; gap:16px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  @media(max-width:1000px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(1,1fr);} .grid-2{grid-template-columns:repeat(1,1fr);} }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    padding:20px 20px; position:relative; box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .card:hover{ box-shadow:var(--shadow); }
  .card-icon{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;
  }
  .card-icon svg{ width:19px; height:19px; }
  .icon-mustard{ background:var(--brand-soft); } .icon-mustard svg path{ stroke:var(--brand-dark); }
  .icon-blue{ background:var(--blue-soft); } .icon-blue svg path{ stroke:var(--blue); }
  .icon-green{ background:var(--green-soft); } .icon-green svg path{ stroke:var(--green); }
  .icon-purple{ background:var(--purple-soft); } .icon-purple svg path{ stroke:var(--purple); }
  .icon-red{ background:var(--red-soft); } .icon-red svg path{ stroke:var(--red); }
  .icon-teal{ background:var(--teal-soft); } .icon-teal svg path{ stroke:var(--teal); }

  .card.tone-total{ background:var(--ink); border:none; }
  .card.tone-total .stat-label{ color:#A9B3AC; }
  .card.tone-total .stat-value{ color:#fff; }
  .card.tone-total .card-icon{ background:rgba(255,255,255,.12); }
  .card.tone-total .card-icon svg path{ stroke:var(--brand); }

  .stat-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700; }
  .stat-value{ font-family:'Plus Jakarta Sans',sans-serif; font-size:24px; font-weight:700; margin-top:8px; color:var(--ink); letter-spacing:-.5px; }
  .stat-sub{ font-size:12px; color:var(--muted); margin-top:6px; }

  .hero-card{
    background:linear-gradient(135deg, #1D2A22, #16231D);
    border-radius:var(--r-lg); padding:28px 30px; color:#fff; box-shadow:var(--shadow-lg); position:relative; overflow:hidden;
    margin-bottom:20px;
  }
  .hero-card::after{
    content:""; position:absolute; right:-40px; top:-40px; width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle, rgba(232,163,61,.25), transparent 70%);
  }
  .hero-card .stat-label{ color:#9FB0A4; }
  .hero-card .stat-value{ font-size:40px; color:#fff; margin-top:10px; }
  .hero-card .stat-sub{ color:#8FA097; }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    padding:22px; margin-bottom:20px; box-shadow:var(--shadow-sm);
  }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; flex-wrap:wrap; }
  .panel-head h3{ font-family:'Plus Jakarta Sans',sans-serif; font-size:15.5px; margin:0; color:var(--ink); font-weight:700; letter-spacing:-.1px; }
  .panel-head .actions{ display:flex; gap:8px; flex-wrap:wrap; }

  /* Receipt-style leader rows (kept as a light signature touch) */
  .ticket-line{ display:flex; align-items:baseline; gap:8px; padding:8px 0; }
  .ticket-line .lbl{ font-size:13.5px; color:var(--ink-soft); white-space:nowrap; }
  .ticket-line .dots{ flex:1; border-bottom:1.5px dotted var(--border-strong); margin-bottom:4px; }
  .ticket-line .val{ font-family:'Plus Jakarta Sans',sans-serif; font-size:13.5px; font-weight:700; white-space:nowrap; }
  .val.pos{ color:var(--green); }
  .val.neg{ color:var(--red); }
  .ticket-total{ border-top:1.5px solid var(--border-strong); margin-top:8px; padding-top:12px; }
  .ticket-total .lbl{ font-weight:800; color:var(--ink); }
  .ticket-total .val{ font-size:16px; }

  /* Tables */
  table.data{ width:100%; border-collapse:collapse; font-size:13px; }
  table.data th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted);
    border-bottom:1.5px solid var(--border); padding:9px 10px; font-weight:700; background:var(--surface-2);
    position:sticky; top:0;
  }
  table.data th:first-child{ border-top-left-radius:8px; }
  table.data th:last-child{ border-top-right-radius:8px; }
  table.data td{ padding:10px 10px; border-bottom:1px solid var(--border); color:var(--ink); }
  table.data tbody tr{ transition:background .1s ease; }
  table.data tbody tr:hover{ background:var(--surface-2); }
  table.data td.num{ font-family:'Plus Jakarta Sans',sans-serif; font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
  .table-wrap{ overflow-x:auto; border-radius:8px; }

  .badge{
    display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:700;
  }
  .badge-ok{ background:var(--green-soft); color:var(--green); }
  .badge-wait{ background:var(--brand-soft); color:var(--brand-dark); }
  .badge-parc{ background:var(--blue-soft); color:var(--blue); }

  .stamp{
    display:inline-flex; align-items:center; border-radius:6px; padding:3px 9px; font-size:10px; font-weight:800;
    text-transform:uppercase; letter-spacing:.4px;
  }
  .stamp.ok{ color:var(--green); background:var(--green-soft); }
  .stamp.wait{ color:var(--brand-dark); background:var(--brand-soft); }
  .stamp.parc{ color:var(--blue); background:var(--blue-soft); }

  .pill-conta{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px 4px 6px; border-radius:20px; }
  .pill-conta .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  .tabs-sub{ display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--border); }
  .tabs-sub button{
    background:none; border:none; cursor:pointer; padding:10px 16px; font-weight:700; font-size:13px;
    color:var(--muted); border-bottom:2.5px solid transparent; margin-bottom:-1px; font-family:'Plus Jakarta Sans',sans-serif;
    transition:color .15s ease;
  }
  .tabs-sub button.active{ color:var(--ink); border-bottom-color:var(--brand); }
  .tabs-sub button:hover{ color:var(--ink); }

  .form-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px 16px; }
  @media(max-width:900px){ .form-grid{ grid-template-columns:repeat(2,1fr);} }
  @media(max-width:600px){ .form-grid{ grid-template-columns:1fr;} }
  .form-grid .field{ margin-bottom:0; }
  .field.span-2{ grid-column:span 2; }
  .field.span-3{ grid-column:span 3; }
  @media(max-width:900px){ .field.span-3{ grid-column:span 2;} }
  @media(max-width:600px){ .field.span-2, .field.span-3{ grid-column:span 1;} }

  .empty-state{ text-align:center; padding:44px 20px; color:var(--muted); }
  .empty-state .ico{ margin-bottom:10px; display:flex; align-items:center; justify-content:center; }
  .empty-state .ico svg{ width:32px; height:32px; opacity:.5; }

  .chip{
    display:inline-flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:6px 8px 6px 13px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .chip button{ background:var(--surface); border:1px solid var(--border); border-radius:50%; width:18px; height:18px; cursor:pointer; color:var(--red); font-weight:800; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}

  .color-swatch{ width:16px; height:16px; border-radius:5px; display:inline-block; border:1px solid rgba(0,0,0,.08); vertical-align:-3px; margin-right:6px; }
  .color-dot-picker{ display:flex; gap:8px; flex-wrap:wrap; }
  .color-dot-picker label{ cursor:pointer; }
  .color-dot-picker input{ display:none; }
  .color-dot-picker .swatch-btn{
    width:28px; height:28px; border-radius:9px; display:block; border:2px solid transparent; cursor:pointer; transition:border-color .15s ease, transform .1s ease;
  }
  .color-dot-picker input:checked + .swatch-btn{ border-color:var(--ink); transform:scale(1.08); }

  /* Toasts */
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:14px 20px;
    border-radius:var(--r-sm); font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lg); z-index:200;
    opacity:0; transform:translateY(12px); transition:all .25s ease; pointer-events:none;
    display:flex; align-items:center; gap:10px; max-width:360px;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.success{ background:#1E3A2A; }
  .toast .toast-ico{
    width:22px; height:22px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .toast .toast-ico svg{ width:13px; height:13px; }
  .toast .toast-ico svg path{ stroke:#fff; stroke-width:3; }
  .toast.plain .toast-ico{ display:none; }

  .mini-note{ font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.55; }

  .chart-box{ position:relative; height:290px; }
  .chart-box.small{ height:230px; }
  .chart-box.tall{ height:360px; }

  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:4px; }
  .filter-bar .field{ margin-bottom:0; min-width:150px; }
  .search-row{ display:flex; gap:10px; margin-top:14px; }
  .search-row input{ flex:1; }
  .search-wrap{ position:relative; flex:1; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); }
  .search-wrap svg path{ stroke:var(--muted); }
  .search-wrap input{ padding-left:36px !important; }

  .modal-bg{
    position:fixed; inset:0; background:rgba(15,20,15,.55); display:none; align-items:center; justify-content:center; z-index:150; padding:20px;
    backdrop-filter:blur(2px);
  }
  .modal-bg.show{ display:flex; }
  .modal{ background:var(--surface); border-radius:var(--r-lg); max-width:420px; width:100%; padding:26px; box-shadow:var(--shadow-lg); }
  .modal h3{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; margin:0 0 8px; font-size:17px; }
  .modal p{ font-size:13.5px; color:var(--ink-soft); line-height:1.55; }
  .modal .modal-actions{ display:flex; gap:10px; margin-top:20px; justify-content:flex-end; }
  #bulkDeleteOk:disabled{ opacity:.45; cursor:not-allowed; }

  @media print{
    .sidebar, .topbar .actions, #authScreen, .no-print{ display:none !important; }
    body{ background:#fff; }
  }

  /* Elementos exclusivos do shell mobile (Painel Mobile): escondidos por padrão;
     só ficam visíveis dentro do @media(max-width:800px) abaixo. IDs/classes novos,
     nunca usados por nenhum elemento do layout desktop. */
  #mHeader, #mBottomNav, #mFab, #mSheetBackdrop, #mSheet{ display:none; }

  /* Rodapé "Total dos Lançamentos" (só aparece com filtro ativo) */
  .lanc-total{ margin-top:14px; padding:14px 16px; border:1px solid var(--border-strong); background:var(--surface-2); border-radius:var(--r); }
  .lanc-total-title{ font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px; }
  .lanc-total-line{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:4px 0; font-size:13.5px; color:var(--ink-soft); }
  .lanc-total-line .v{ font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .lanc-total-line.pos .v{ color:var(--green); }
  .lanc-total-line.neg .v{ color:var(--red); }
  .lanc-total-line.saldo{ margin-top:6px; padding-top:10px; border-top:1px solid var(--border-strong); font-weight:700; color:var(--ink); }
  .lanc-total-line.saldo .v{ color:var(--blue); font-size:15px; }
  .lanc-total-meta{ margin-top:8px; font-size:11.5px; color:var(--muted); }

  @media(max-width:800px){
    .lanc-total{ margin-bottom:12px; }
    .shell{ flex-direction:column; }

   Project Settings → API → Project URL / anon public key         */
const SUPABASE_URL = 'https://nbnwovsanqomrbxmgmvi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ibndvdnNhbnFvbXJieG1nbXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3OTg4MDEsImV4cCI6MjEwMDM3NDgwMX0.sqLZIIjy4CXG4gFRj6jjyK0LW1fA_pmSmEVRyfHt7gE';

const valueLabelsPlugin = {
  id: 'valueLabelsPlugin',
  afterDatasetsDraw(chart){
    const opts = chart.options && chart.options.plugins && chart.options.plugins.valueLabelsPlugin;
    if(!opts || !opts.enabled) return;
    const ctx = chart.ctx;
    chart.data.datasets.forEach((dataset, dsIndex)=>{
      const meta = chart.getDatasetMeta(dsIndex);
      if(meta.hidden) return;
      meta.data.forEach((element, index)=>{
        const value = dataset.data[index];
        if(value===undefined || value===null || value===0) return;
        const label = 'R$ ' + Number(value).toLocaleString('pt-BR', {maximumFractionDigits:0});
        ctx.save();
        ctx.font = "700 11px 'Plus Jakarta Sans', sans-serif";
        ctx.fillStyle = '#1D2420';
        try{
          const pos = element.tooltipPosition ? element.tooltipPosition() : {x:element.x, y:element.y};
          if(chart.options.indexAxis === 'y'){
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText(label, pos.x + 6, pos.y);
          } else {
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
            ctx.fillText(label, pos.x, pos.y - 4);
          }
        } catch(e){ /* nunca deixa o desenho de rótulo quebrar o gráfico */ }
        ctx.restore();
      });
    });
  }
};

let _valueLabelsRegistered = false;
function registerValueLabelsPlugin(){
  if(_valueLabelsRegistered || typeof Chart === 'undefined') return;
  try{ Chart.register(valueLabelsPlugin); _valueLabelsRegistered = true; }catch(e){}

   Em vez de depender de uma <script src> estática no <head> (que pode
   perder a corrida contra o código inline em alguns ambientes/sandboxes),
   carregamos a biblioteca sob demanda e SEMPRE esperamos ela confirmar
   que terminou de carregar antes de criar qualquer gráfico.
   Fonte primária: arquivo local em vendor/ (não depende de CDN nem rede
   externa). Caso o arquivo local falhe por algum motivo, caem para CDNs
   públicos como reserva. */
const CHART_LIB_SOURCES = [
  'vendor/chart.umd.min.js',
  'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
  'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.js',
];
let _chartLibPromise = null;
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = ()=> reject(new Error('Falha ao carregar script: ' + src));
    document.head.appendChild(s);
  });
}
async function ensureChartLib(){
  if(typeof Chart !== 'undefined'){
    registerValueLabelsPlugin();
    return;
  }
  if(_chartLibPromise) return _chartLibPromise;
  _chartLibPromise = (async ()=>{
    let lastError = null;
    for(const src of CHART_LIB_SOURCES){
      try{
        await loadScriptOnce(src);
        if(typeof Chart !== 'undefined'){
          registerValueLabelsPlugin();
          return;
        }
      }catch(e){
        lastError = e;
      }
    }
    throw lastError || new Error('Falha ao carregar a biblioteca de gráficos (Chart.js).');
  })().catch(err=>{
    _chartLibPromise = null;
    throw err;
  });
  return _chartLibPromise;
}

/* ---------- Storage helpers (agora usando Supabase, por usuário logado) ---------- */
let _cachedUserId = null;

async function getCurrentUserId(){
  if(_cachedUserId) return _cachedUserId;
  if(!sb) return null;
  const { data, error } = await sb.auth.getUser();
  if(error || !data || !data.user) return null;
  _cachedUserId = data.user.id;
  return _cachedUserId;
}

/* storeGet NUNCA retorna null silenciosamente por causa de um erro — só retorna
   null quando a busca teve SUCESSO e não existe linha nenhuma para essa chave
   (usuário genuinamente novo). Qualquer erro real (rede, RLS, timeout, sessão
   ainda não pronta etc.) é relançado (throw) depois de algumas tentativas, para
   que quem chamar consiga diferenciar "não existe" de "falhou ao buscar" — foi
   exatamente a confusão entre esses dois casos que causou a perda de dados em
   produção (loadAllData tratava falha de leitura como "não existe" e regravava
   os dados de exemplo por cima dos dados reais do usuário). */
async function storeGet(key, attempt){
  attempt = attempt || 1;
  const MAX_ATTEMPTS = 3;
  try{
    if(!sb) throw new Error('Supabase não está configurado (sb é null).');
    const userId = await getCurrentUserId();
    if(!userId) throw new Error('Não foi possível identificar o usuário logado (getCurrentUserId retornou vazio).');
    const { data, error } = await sb.from('kv_store').select('value').eq('user_id', userId).eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? data.value : null;
  } catch(e){
    console.error(`storeGet: falha na tentativa ${attempt}/${MAX_ATTEMPTS} para a chave "${key}":`, e);
    if(attempt < MAX_ATTEMPTS){
      await new Promise(resolve=> setTimeout(resolve, attempt===1 ? 500 : 1000));
      return storeGet(key, attempt+1);
    }
    throw e;
  }
}

async function storeSet(key, value){
  try{
    if(!sb) return false;
    const userId = await getCurrentUserId();
    if(!userId) return false;
    const { error } = await sb.from('kv_store').upsert({ user_id:userId, key, value, updated_at:new Date().toISOString() });
    if(error){ console.error('storeSet falhou:', key, error); return false; }
    return true;
  } catch(e){ console.error('storeSet exceção:', key, e); return false; }
}

function contaNome(id){
  if(id === CONTA_NAO_CLASSIFICADO) return 'Não classificado';
  const c = state.contas.find(x=>x.id===id); return c ? c.nome : (id||'—');

function formatBRL(n){
  const v = Number(n)||0;
  return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function formatNum(n){
  return Number(n||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function parseDateLocal(str){
  // str: YYYY-MM-DD -> Date at local midnight (avoid TZ shift)
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatDateBR(str){
  if(!str) return '';
  const d = parseDateLocal(str);
  return d.toLocaleDateString('pt-BR');
}
function toast(msg, opts){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.remove('success','plain');
  t.classList.add(opts && opts.success ? 'success' : 'plain');
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), opts && opts.duration ? opts.duration : 2800);
}
function toastSuccess(msg){ toast(msg, {success:true, duration:3200}); }

function confirmDialog(title, text){
  return new Promise((resolve)=>{
    const modal = document.getElementById('confirmModal');
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    modal.classList.add('show');
    const ok = document.getElementById('confirmOk');
    const cancel = document.getElementById('confirmCancel');
    function cleanup(v){
      modal.classList.remove('show');
      ok.removeEventListener('click', onOk);
      cancel.removeEventListener('click', onCancel);
      resolve(v);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    ok.addEventListener('click', onOk);
    cancel.addEventListener('click', onCancel);
  });
}

async function initAuth(){
  if(!sb){ renderConfigMissing(); return; }
  const { data } = await sb.auth.getSession();
  if(data && data.session){ await bootApp(); } else { renderAuthLogin(); }
}

async function bootApp(){
  ensureChartLib().catch(()=>{ /* falha silenciosa aqui; cada gráfico trata o próprio erro na hora de renderizar */ });

  try{
    await loadAllData();
  } catch(e){
    // Nunca prosseguimos para dentro do app com dados possivelmente incompletos/
    // sobrescritos. Mostra a tela de erro (ainda na área do #authScreen) e para o boot aqui.
    console.error('bootApp: falha ao carregar dados do usuário, boot interrompido por segurança:', e);
    document.getElementById('app').style.display = 'none';
    document.getElementById('authScreen').style.display = 'flex';
    renderLoadError(e);
    return;
  }

  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initNav();
  initMobileShell();
  renderTopbarDate();
  navigateTo('dashboard');
  checkBackupReminder();
}

/* ---------- Data load / persist ----------
   Regra de ouro pós-incidente: só é seguro popular dados de exemplo (seed) quando
   TODAS as chaves vierem ausentes (usuário genuinamente novo) E a chave de controle
   lc_initialized também não existir ainda. Qualquer erro real numa das buscas faz
   loadAllData() lançar (throw) e o boot é interrompido ANTES de qualquer storeSet —
   nunca sobrescrevemos nada no banco em cima de uma falha de leitura. */
async function loadAllData(){
  const [entries, fornecedores, clientes, formas, categorias, contas, initialized] = await Promise.all([
    storeGet('lc_entries'), storeGet('lc_fornecedores'), storeGet('lc_clientes'),
    storeGet('lc_formas'), storeGet('lc_categorias'), storeGet('lc_contas'), storeGet('lc_initialized')
  ]);
  // Se qualquer storeGet acima tiver falhado de verdade (após as tentativas de retry),
  // a exceção já foi lançada dentro do Promise.all e essa função já teria parado aqui.

  const algumaChaveAusente = entries===null || fornecedores===null || clientes===null || formas===null || categorias===null || contas===null;
  const todasAsChavesAusentes = entries===null && fornecedores===null && clientes===null && formas===null && categorias===null && contas===null;

  if(initialized !== null){
    // Essa conta já foi inicializada antes com sucesso. A partir daqui, TODA chave
    // deve sempre existir (mesmo que vazia, ex: "[]") — se alguma estiver ausente,
    // isso não é "usuário novo", é uma inconsistência real. Nunca gravamos nada
    // por cima; interrompemos e deixamos o chamador (bootApp) mostrar erro.
    if(algumaChaveAusente){
      throw new Error('Inconsistência: a conta já foi inicializada anteriormente, mas alguns dados não foram encontrados no servidor. Por segurança, nada foi sobrescrito.');
    }
    state.entries = JSON.parse(entries);
    state.fornecedores = JSON.parse(fornecedores);
    state.clientes = JSON.parse(clientes);
    state.formas = JSON.parse(formas);
    state.categorias = JSON.parse(categorias);
    state.contas = JSON.parse(contas);
    return;
  }

  if(todasAsChavesAusentes){
    // lc_initialized nunca existiu E nenhuma chave de dado existe: usuário
    // genuinamente novo. Só AQUI é seguro popular com os dados de exemplo.
    state.entries = SEED_ENTRIES.slice();
    state.fornecedores = SEED_FORNECEDORES.slice();
    state.clientes = SEED_CLIENTES.slice();
    state.formas = SEED_FORMAS.slice();
    state.categorias = { entradas: SEED_ENTRADAS_CAT.slice(), saidas: SEED_SAIDAS_CAT.slice() };
    state.contas = SEED_CONTAS.slice();
    await Promise.all([
      storeSet('lc_entries', JSON.stringify(state.entries)),
      storeSet('lc_fornecedores', JSON.stringify(state.fornecedores)),
      storeSet('lc_clientes', JSON.stringify(state.clientes)),
      storeSet('lc_formas', JSON.stringify(state.formas)),
      storeSet('lc_categorias', JSON.stringify(state.categorias)),
      storeSet('lc_contas', JSON.stringify(state.contas)),
    ]);
    await storeSet('lc_initialized', 'true');
    return;
  }

  // lc_initialized ainda não existe, mas nem todas as chaves estão ausentes: é uma
  // conta com dados reais anterior a este fix (ainda não tinha a marca de controle).
  // Carregamos o que existe de verdade e só preenchemos com seed a chave que
  // individualmente estiver ausente — nunca tocamos nas chaves que já têm dado.
  state.entries = entries!==null ? JSON.parse(entries) : SEED_ENTRIES.slice();
  state.fornecedores = fornecedores!==null ? JSON.parse(fornecedores) : SEED_FORNECEDORES.slice();
  state.clientes = clientes!==null ? JSON.parse(clientes) : SEED_CLIENTES.slice();
  state.formas = formas!==null ? JSON.parse(formas) : SEED_FORMAS.slice();
  state.categorias = categorias!==null ? JSON.parse(categorias) : { entradas: SEED_ENTRADAS_CAT.slice(), saidas: SEED_SAIDAS_CAT.slice() };
  state.contas = contas!==null ? JSON.parse(contas) : SEED_CONTAS.slice();

  const gravacoesPendentes = [];
  if(entries===null) gravacoesPendentes.push(storeSet('lc_entries', JSON.stringify(state.entries)));
  if(fornecedores===null) gravacoesPendentes.push(storeSet('lc_fornecedores', JSON.stringify(state.fornecedores)));
  if(clientes===null) gravacoesPendentes.push(storeSet('lc_clientes', JSON.stringify(state.clientes)));
  if(formas===null) gravacoesPendentes.push(storeSet('lc_formas', JSON.stringify(state.formas)));
  if(categorias===null) gravacoesPendentes.push(storeSet('lc_categorias', JSON.stringify(state.categorias)));
  if(contas===null) gravacoesPendentes.push(storeSet('lc_contas', JSON.stringify(state.contas)));
  await Promise.all(gravacoesPendentes);
  // Marca a conta como inicializada para nunca mais cair nesse caminho ambíguo.
  await storeSet('lc_initialized', 'true');
}

/* ================= BACKUP MANUAL ================= */
const BACKUP_KEYS = ['lc_entries','lc_fornecedores','lc_clientes','lc_formas','lc_categorias','lc_contas'];

async function baixarBackupCompleto(){
  try{
    let email = '';
    try{
      const { data } = await sb.auth.getUser();
      email = (data && data.user && data.user.email) || '';
    } catch(e){ /* segue sem e-mail no metadado se isso falhar */ }

    const payload = {
      _meta: {
        app: 'Lanchonete Central — Painel de Caixa',
        geradoEm: new Date().toISOString(),
        usuario: email
      },
      lc_entries: state.entries,
      lc_fornecedores: state.fornecedores,
      lc_clientes: state.clientes,
      lc_formas: state.formas,
      lc_categorias: state.categorias,
      lc_contas: state.contas
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const pad = n=> String(n).padStart(2,'0');
    const nomeArquivo = `backup-lanchonete-central-${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.json`;
    a.href = url; a.download = nomeArquivo;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

    try{ localStorage.setItem('lc_ultimo_backup', now.toISOString()); }catch(e){ /* localStorage indisponível não é crítico */ }

    toastSuccess('Backup baixado com sucesso.');
    return true;
  } catch(e){
    console.error('Falha ao gerar backup:', e);
    toast('Não foi possível gerar o backup agora. Tente novamente.');
    return false;
  }
}

async function restaurarBackupArquivo(file){
  let payload;
  try{
    const texto = await file.text();
    payload = JSON.parse(texto);
  } catch(e){
    toast('Esse arquivo não é um backup .json válido.');
    return;
  }

  const faltando = BACKUP_KEYS.filter(k=> !(k in payload));
  if(faltando.length){
    toast('Arquivo de backup incompleto — faltam dados esperados nele.');
    return;
  }

  const meta = payload._meta;
  const infoData = meta && meta.geradoEm ? new Date(meta.geradoEm).toLocaleString('pt-BR') : 'data desconhecida';
  const infoUsuario = meta && meta.usuario ? ` (conta: ${meta.usuario})` : '';
  const ok = await confirmDialog(
    'Restaurar backup?',
    `Isso vai SOBRESCREVER todos os dados atuais (lançamentos, fornecedores, clientes, formas de pagamento e contas) com o conteúdo desse arquivo, gerado em ${infoData}${infoUsuario}. Essa ação não pode ser desfeita automaticamente.`
  );
  if(!ok) return;

  try{
    state.entries = payload.lc_entries;
    state.fornecedores = payload.lc_fornecedores;
    state.clientes = payload.lc_clientes;
    state.formas = payload.lc_formas;
    state.categorias = payload.lc_categorias;
    state.contas = payload.lc_contas;

    await Promise.all([
      storeSet('lc_entries', JSON.stringify(state.entries)),
      storeSet('lc_fornecedores', JSON.stringify(state.fornecedores)),
      storeSet('lc_clientes', JSON.stringify(state.clientes)),
      storeSet('lc_formas', JSON.stringify(state.formas)),
      storeSet('lc_categorias', JSON.stringify(state.categorias)),
      storeSet('lc_contas', JSON.stringify(state.contas)),
    ]);
    await storeSet('lc_initialized', 'true');

    toastSuccess('Backup restaurado com sucesso.');
    navigateTo(state.currentView || 'dashboard');
  } catch(e){
    console.error('Falha ao restaurar backup:', e);
    toast('Não foi possível restaurar o backup agora. Tente novamente.');
  }
}

/* Lembrete discreto (não bloqueante) para o usuário baixar um backup manual de
   tempos em tempos. A data do último backup fica só no localStorage do navegador
   (não precisa ir para o Supabase, é só uma conveniência de UI). */
function checkBackupReminder(){
  try{
    const ultimo = localStorage.getItem('lc_ultimo_backup');
    const jaAvisouNestaSessao = sessionStorage.getItem('lc_backup_reminder_shown');
    if(jaAvisouNestaSessao) return;
    const umDiaMs = 24*60*60*1000;
    const precisaAvisar = !ultimo || (Date.now() - new Date(ultimo).getTime()) > umDiaMs;
    if(precisaAvisar){
      sessionStorage.setItem('lc_backup_reminder_shown', '1');
      setTimeout(()=>{
        toast('Já faz um tempo desde seu último backup — considere baixar um agora (Cadastros → Backup).', { duration:6000 });
      }, 1500);
    }
  } catch(e){ /* localStorage/sessionStorage indisponível não é crítico */ }
}

function getRelatorioEntries(periodo){
  const ano = state.relAno;
  const mes = state.relMes;
  const tipo = state.relTipo || 'todos';
  let list = state.entries.filter(e=> e.movimento!=='transferencia');
  list = list.filter(e=> entryYear(e)===ano);
  if(periodo==='mes') list = list.filter(e=> entryMonth(e)===mes);
  if(tipo!=='todos') list = list.filter(e=> e.movimento===tipo);
  list.sort((a,b)=> a.data.localeCompare(b.data));
  return list;
}

function renderRelPreview(periodo){
  const list = getRelatorioEntries(periodo || document.getElementById('relPeriodo').value);
  const totalEnt = list.filter(e=>e.movimento==='entrada').reduce((a,e)=>a+Number(e.valor||0),0);
  const totalSai = list.filter(e=>e.movimento==='saida').reduce((a,e)=>a+Number(e.valor||0),0);

  const rows = list.map(e=>`
    <tr>
      <td class="mono">${formatDateBR(e.data)}</td>
      <td>${e.movimento==='entrada'?'Entrada':'Saída'}</td>
      <td>${e.categoria}</td>
      <td>${e.descricao||''}</td>
      <td>${contaNome(e.conta)}</td>
      <td>${e.formaPagamento||''}</td>
      <td class="num">${formatBRL(e.valor)}</td>
    </tr>
  `).join('');

  document.getElementById('relPreview').innerHTML = `
    <table class="data">
      <thead><tr><th>Data</th><th>Mov.</th><th>Categoria</th><th>Descrição</th><th>Conta</th><th>Forma</th><th style="text-align:right;">Valor</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7"><div class="empty-state">Nenhum lançamento no período selecionado</div></td></tr>`}</tbody>
      <tfoot>
        <tr style="background:var(--paper-2); font-weight:800;"><td colspan="6">Total Entradas</td><td class="num">${formatBRL(totalEnt)}</td></tr>
        <tr style="background:var(--paper-2); font-weight:800;"><td colspan="6">Total Saídas</td><td class="num">${formatBRL(totalSai)}</td></tr>
        <tr style="background:var(--ink); color:#fff; font-weight:800;"><td colspan="6">Saldo do Período</td><td class="num" style="color:#fff;">${formatBRL(totalEnt-totalSai)}</td></tr>
      </tfoot>
    </table>
  `;
}

function csvEscape(v){
  const s = String(v===undefined||v===null?'':v);
  if(/[",;\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

function exportarCSV(){
  const periodo = document.getElementById('relPeriodo').value;
  const list = getRelatorioEntries(periodo);
  const header = ['Data','Movimento','Categoria','Descricao','Conta','Forma de Pagamento','Status','Valor'];
  const lines = [header.join(';')];
  list.forEach(e=>{
    lines.push([
      formatDateBR(e.data), e.movimento==='entrada'?'Entrada':'Saida', e.categoria, e.descricao||'',
      contaNome(e.conta), e.formaPagamento||'', e.status||'', formatNum(e.valor)
    ].map(csvEscape).join(';'));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const nomeArquivo = `lanchonete-central-relatorio-${state.relAno}${periodo==='mes'?'-'+String(state.relMes+1).padStart(2,'0'):''}.csv`;
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toastSuccess('Relatório exportado com sucesso.');
}

function mDateLabel(d){
  const hoje = new Date().toISOString().slice(0,10);
  const ontemDate = new Date(); ontemDate.setDate(ontemDate.getDate()-1);
  const ontem = ontemDate.toISOString().slice(0,10);
  if(d===hoje) return 'Hoje · '+formatDateBR(d);
  if(d===ontem) return 'Ontem · '+formatDateBR(d);
  return formatDateBR(d);
}

function lancRowHTML(e){
  const isT = e.movimento==='transferencia';

  const soft = e.movimento==='entrada' ? 'var(--green-soft)' : (e.movimento==='saida' ? 'var(--red-soft)' : 'var(--blue-soft)');

  const sub = isT
    ? `${contaNome(e.contaOrigem)} → ${contaNome(e.contaDestino)}`
    : `${(e.fornecedor||e.cliente) ? (e.fornecedor||e.cliente)+' · ' : ''}${contaNome(e.conta)}`;
  const titulo = e.descricao || e.categoria || '—';

/* Rodapé "Total dos Lançamentos": somente leitura, derivado de state.__filtroLancResult.
   Retorna '' (nada no DOM) quando não há filtro ativo ou a lista filtrada está vazia. */
function lancTotalHTML(){
  const list = state.__filtroLancResult || [];
  if(resumoFiltrosLanc().semFiltro || !list.length) return '';
  const mobile = isMobileViewport();
  const fmt = n => mobile ? mMoney(n) : formatBRL(n);
  let ent = 0, sai = 0, nEnt = 0, nSai = 0, nTransf = 0;
  list.forEach(e=>{
    if(e.movimento==='entrada'){ ent += Number(e.valor)||0; nEnt++; }
    else if(e.movimento==='saida'){ sai += Number(e.valor)||0; nSai++; }
    else if(e.movimento==='transferencia'){ nTransf++; }
  });
  const plural = (n, s, p) => `${n} ${n===1 ? s : p}`;
  const saldo = ent - sai;
  const linhas = [];
  if(nEnt) linhas.push(`<div class="lanc-total-line pos"><span>Entradas</span><span class="v">${fmt(ent)}</span></div>`);
  if(nSai) linhas.push(`<div class="lanc-total-line neg"><span>Saídas</span><span class="v">${fmt(sai)}</span></div>`);
  if(nEnt && nSai) linhas.push(`<div class="lanc-total-line saldo"><span>Total (saldo)</span><span class="v">${saldo<0 && !(mobile && mobileHideValues) ? '− ' : ''}${fmt(Math.abs(saldo))}</span></div>`);
  const meta = [plural(list.length, 'lançamento', 'lançamentos')];
  if(nTransf) meta.push(`${plural(nTransf, 'transferência', 'transferências')} (${nTransf===1 ? 'não somada' : 'não somadas'})`);
  return `<section class="lanc-total" aria-label="Total dos Lançamentos">
    <div class="lanc-total-title">Total dos Lançamentos</div>
    <div aria-live="polite" aria-atomic="true">${linhas.join('')}<div class="lanc-total-meta">${meta.join(' · ')}</div></div>
  </section>`;
}

function atualizarTotalLanc(){
  const el = document.getElementById('lancTotalWrap') || document.getElementById('mLancTotalWrap');
  if(el) el.innerHTML = lancTotalHTML();
}

function buildLancGroupsHTML(){
  const list = state.__filtroLancResult || [];
  if(!list.length){
    return `<div class="m-empty"><div class="t">Nenhum lançamento encontrado</div><div class="s">Ajuste a busca ou os filtros.</div></div>`;
  }
  const byDate = {};
  list.forEach(e=>{ (byDate[e.data] = byDate[e.data]||[]).push(e); });
  return Object.keys(byDate).sort().reverse().map(d=>{
    const items = byDate[d];
    const tot = items.reduce((a,e)=> a + (e.movimento==='entrada'?e.valor:(e.movimento==='saida'?-e.valor:0)), 0);
    const totLabel = mobileHideValues ? 'R$ ••••' : (tot>=0?'+ ':'− ')+formatBRL(Math.abs(tot));
    return `
      <div class="m-group-head"><span class="lbl">${mDateLabel(d)}</span><span class="val" style="color:${tot>=0?'var(--green)':'var(--red)'};">${totLabel}</span></div>
      <div class="m-group">${items.map(lancRowHTML).join('')}</div>`;
  }).join('');
}

let mOpenSwipeId = null;
let mSwipeDrag = null;
function closeOpenSwipeRow(){
  if(mOpenSwipeId){
    const el = document.querySelector(`.m-row[data-rowid="${mOpenSwipeId}"]`);
    if(el) el.style.transform = 'translateX(0px)';
    mOpenSwipeId = null;
  }
}
function attachSwipeRow(rowEl, id){
  const onDown = (ev)=>{
    mSwipeDrag = { id, sx: ev.clientX, base: mOpenSwipeId===id ? -136 : 0, moved:false, tx: mOpenSwipeId===id?-136:0 };
    try{ rowEl.setPointerCapture(ev.pointerId); }catch(err){}
  };
  const onMove = (ev)=>{
    const d = mSwipeDrag; if(!d || d.id!==id) return;
    const dx = ev.clientX - d.sx;
    if(Math.abs(dx)>6) d.moved = true;
    if(!d.moved) return;
    d.tx = Math.max(-136, Math.min(0, d.base+dx));
    rowEl.style.transition = 'none';
    rowEl.style.transform = `translateX(${d.tx}px)`;
  };
  const onUp = ()=>{
    const d = mSwipeDrag; mSwipeDrag = null;
    if(!d || d.id!==id) return;
    rowEl.style.transition = 'transform .22s ease';
    if(d.moved){
      const open = d.tx < -60;
      if(mOpenSwipeId && mOpenSwipeId!==id) closeOpenSwipeRow();
      rowEl.style.transform = open ? 'translateX(-136px)' : 'translateX(0px)';
      mOpenSwipeId = open ? id : null;
      rowEl.dataset.justDragged = '1';
      setTimeout(()=>{ rowEl.dataset.justDragged=''; }, 50);
    }
  };
  rowEl.addEventListener('pointerdown', onDown);
  rowEl.addEventListener('pointermove', onMove);
  rowEl.addEventListener('pointerup', onUp);
  rowEl.addEventListener('pointercancel', onUp);
  rowEl.addEventListener('click', ()=>{
    if(rowEl.dataset.justDragged) return;
    if(mOpenSwipeId===id){ closeOpenSwipeRow(); return; }
    abrirDetalhesLancamentoMobile(id);
  });
}

    document.getElementById('mBtnRestaurarBackup').addEventListener('click', ()=> document.getElementById('mInputRestoreBackup').click());
    document.getElementById('mInputRestoreBackup').addEventListener('change', async (ev)=>{

      renderCadContent();
    });

  let rows = [];

    const arr = sub==='fornecedores' ? state.fornecedores : state.clientes;
    rows = arr.map((c,i)=> mCadRowHTML(c.nome, c.contato || c.obs || '—', c.id, i, null, null, true));
  } else if(sub==='formas'){
    rows = state.formas.map((f,i)=> mCadRowHTML(f.nome, 'Forma de pagamento', f.id, i, null, null, true));
  } else if(sub==='categorias'){
    const todas = state.categorias.entradas.map(c=>({ tipo:'entrada', nome:c })).concat(state.categorias.saidas.map(c=>({ tipo:'saida', nome:c })));
    rows = todas.map((c,i)=>{
      const cor = c.tipo==='entrada' ? { bg:'var(--green-soft)', fg:'var(--green)' } : { bg:'var(--red-soft)', fg:'var(--red)' };

      else if(sub==='formas'){ state.formas = state.formas.filter(x=>x.id!==id); await persistFormas(); }
      else if(sub==='bancos'){ state.contas = state.contas.filter(x=>x.id!==id); await persistContas(); }
      toast('Removido.');
      renderCadContent();
    });
  });
}

/* Categorias cadastráveis. Só mexem em state.categorias (já persistido em lc_categorias);
   as categorias atuais continuam intactas. Uma categoria só pode ser excluída se nenhum
   lançamento a usa, para não alterar os totais já calculados. */
const CATEGORIAS_PROTEGIDAS = ['Insumos Lanchonete','Insumos Produção']; // base do cálculo de CMV (Mensal)

function usoCategoria(nome){ return state.entries.filter(e=> e.categoria===nome).length; }

function gravarCategorias(){ return storeSet('lc_categorias', JSON.stringify(state.categorias)); }

async function adicionarCategoria(tipo, nomeBruto){
  const nome = String(nomeBruto||'').trim().replace(/\s+/g,' ');
  if(!nome){ toast('Informe o nome da categoria.'); return false; }
  if(nome.length>40){ toast('O nome da categoria pode ter no máximo 40 caracteres.'); return false; }
  if(/[<>"]/.test(nome)){ toast('O nome não pode conter < > ou aspas duplas.'); return false; }
  const chave = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const existente = state.categorias.entradas.concat(state.categorias.saidas).find(c=> chave(c)===chave(nome));
  if(existente){ toast(`Já existe a categoria "${existente}".`); return false; }
  const lista = tipo==='entrada' ? state.categorias.entradas : state.categorias.saidas;
  lista.push(nome);
  let ok = false;
  try{ ok = await gravarCategorias(); } catch(e){ console.error('Falha ao gravar categorias:', e); }
  if(ok !== true){
    lista.pop();
    toast('Não foi possível salvar a categoria. Verifique a conexão e tente de novo.');
    return false;
  }
  toastSuccess('Categoria adicionada com sucesso.');
  return true;
}

async function removerCategoria(tipo, nome){
  const lista = tipo==='entrada' ? state.categorias.entradas : state.categorias.saidas;
  const idx = lista.indexOf(nome);
  if(idx<0) return false;
  if(CATEGORIAS_PROTEGIDAS.includes(nome)){
    toast('Usada no cálculo de CMV: não pode ser removida.');
    return false;
  }
  const uso = usoCategoria(nome);
  if(uso>0){
    toast(`Em uso por ${uso} lançamento(s): não pode ser removida.`);
    return false;
  }
  const ok = await confirmDialog(`Remover a categoria "${nome}"?`, 'Nenhum lançamento usa essa categoria. Ela deixa de aparecer nas listas de escolha.');
  if(!ok) return false;
  lista.splice(idx,1);
  let gravou = false;
  try{ gravou = await gravarCategorias(); } catch(e){ console.error('Falha ao gravar categorias:', e); }
  if(gravou !== true){
    lista.splice(idx,0,nome);
    toast('Não foi possível remover a categoria. Verifique a conexão e tente de novo.');
    return false;
  }
  toast('Categoria removida.');
  return true;
}

                <td style="font-weight:600;">${escapeHtml(l.nome)}</td>
                <td>${l.tipo==='entrada' ? '<span class="badge badge-ok">Entrada</span>' : '<span class="badge" style="background:var(--red-soft); color:var(--red);">Saída</span>'}</td>
                <td class="num">${usoCategoria(l.nome)}</td>
                <td><button class="btn btn-ghost btn-sm" data-delcat-tipo="${l.tipo}" data-delcat-nome="${escapeHtml(l.nome)}" style="color:var(--red);">🗑 Remover</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
  const adicionar = async ()=>{
    const input = document.getElementById('cadCatNome');
    if(await adicionarCategoria(document.getElementById('cadCatTipo').value, input.value)) renderCadContent();
  };
  document.getElementById('btnAddCat').addEventListener('click', adicionar);
  document.getElementById('cadCatNome').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); adicionar(); } });
  el.querySelectorAll('[data-delcat-nome]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(await removerCategoria(btn.dataset.delcatTipo, btn.dataset.delcatNome)) renderCadContent();
    });
  });
}

function renderCadContent(){

  if(isMobileViewport()){
    renderCadContentMobile(sub);
    return;
  }

  const el = document.getElementById('cadContent');

  if(sub==='fornecedores' || sub==='clientes'){
    const isForn = sub==='fornecedores';

    const label = isForn ? 'Fornecedor' : 'Cliente';

        </div>

        if(isForn){ state.fornecedores = state.fornecedores.filter(x=>x.id!==btn.dataset.delcad); await persistFornecedores(); }
        else { state.clientes = state.clientes.filter(x=>x.id!==btn.dataset.delcad); await persistClientes(); }

        renderCadContent();
      });

  } else if(sub==='bancos'){
    const colorSwatches = (selected)=> Object.keys(ACCOUNT_COLORS).map(k=>{
      const c = ACCOUNT_COLORS[k];
      return `<label>
        <input type="radio" name="novaContaCor" value="${k}" ${selected===k?'checked':''}>
        <span class="swatch-btn" style="background:${c.dot};"></span>
      </label>`;
    }).join('');

    el.innerHTML = `
      <div class="panel">
        <div class="panel-head"><h3>Nova conta / banco de destino</h3></div>

        <button class="btn btn-primary btn-sm" id="btnAddBanco" style="margin-top:14px;">＋ Adicionar conta</button>

        const novaCor = row.querySelector('select.edit-input').value;

      });

    el.querySelectorAll('[data-delbanco]').forEach(btn=>{

          ? 'Existem lançamentos usando essa conta. Eles não serão apagados, mas ficarão referenciando uma conta removida.'

          um lugar seguro (e-mail, Drive, etc.) — ele serve para restaurar tudo caso algo dê errado.

      </div>

        <div class="panel-head"><h3>Restaurar backup</h3></div>
        <p class="mini-note" style="margin-top:0;">
          Selecione um arquivo <code>.json</code> gerado pelo botão acima para <strong>sobrescrever</strong>
          os dados atuais com o conteúdo desse backup. Use com cuidado — essa ação substitui os dados de
          hoje pelos dados do arquivo selecionado.
        </p>
        <input type="file" accept="application/json,.json" id="inputRestoreBackup" style="display:none;">
        <button class="btn btn-outline btn-sm" id="btnRestaurarBackup">⇧ Selecionar arquivo de backup...</button>
      </div>
    `;
    document.getElementById('btnBaixarBackup').addEventListener('click', baixarBackupCompleto);
    document.getElementById('btnRestaurarBackup').addEventListener('click', ()=> document.getElementById('inputRestoreBackup').click());
    document.getElementById('inputRestoreBackup').addEventListener('change', async (ev)=>{
      const file = ev.target.files[0];
      ev.target.value = '';
      if(!file) return;
      await restaurarBackupArquivo(file);
      renderCadContent();
    });
  }
}

   com os MESMOS ids, no template mobile (para que abrirFormLanc/fecharFormLanc/
   montarCamposForm funcionem idênticos nos dois, sem duplicar lógica). No mobile, o
   CSS dentro de @media(max-width:800px) transforma esse mesmo painel num bottom sheet. */

  return `

      <div class="panel-head">

/* Wiring do painel de formulário que independe de estar no template desktop ou
   mobile (mesmos ids, vindos de formPanelHTML()) — reaproveitado nos dois. */

  document.getElementById('btnFecharForm').addEventListener('click', fecharFormLanc);

  });
}

// Impede escolher data inicial depois da final (e vice-versa) no seletor de datas.
function limitarDatasPeriodoLanc(){
  const ini = document.getElementById('fDiaInicio'), fim = document.getElementById('fDiaFim');
  ini.max = fim.value || '';
  fim.min = ini.value || '';
}

async function aplicarCorrecaoContaLote(){
  const novaConta = document.getElementById('fBulkConta').value;
  const alvo = state.__filtroLancResult || [];
  const alvoValido = alvo.filter(e=> e.movimento==='entrada' || e.movimento==='saida');
  if(alvoValido.length===0){ toast('Não há lançamentos na lista filtrada para corrigir.'); return; }
  const nomeConta = contaNome(novaConta);
  const ok = await confirmDialog(
    `Mover ${alvoValido.length} lançamento(s) para "${nomeConta}"?`,
    `Essa ação vai alterar a conta de todos os lançamentos que estão aparecendo na lista filtrada agora (entradas e saídas — transferências não são alteradas). Não pode ser desfeita automaticamente, mas você pode editar de volta a qualquer momento.`
  );
  if(!ok) return;
  const idsAlvo = new Set(alvoValido.map(e=>e.id));
  state.entries.forEach(e=>{ if(idsAlvo.has(e.id)) e.conta = novaConta; });
  await persistEntries();
  toastSuccess(`${alvoValido.length} lançamento(s) movido(s) para ${nomeConta} com sucesso!`);
  atualizarListaLanc();
}

/* ================= EXCLUSÃO EM LOTE DE LANÇAMENTOS =================
   Age sobre a lista filtrada (state.__filtroLancResult), como a correção de conta
   em lote. Os ids são capturados ao ABRIR a confirmação, então o que será
   excluído não muda mesmo se a lista recarregar enquanto o modal está aberto. */
function escapeHtml(s){
  return String(s==null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function resumoFiltrosLanc(){
  const f = state.filtroLanc;
  const periodo = f.periodo==='mes' ? `Mês de ${MESES[f.mes]} (de todos os anos)`
    : (f.periodo==='periodo' && f.diaInicio && f.diaFim) ? (f.diaInicio===f.diaFim ? `Dia ${formatDateBR(f.diaInicio)}` : `De ${formatDateBR(f.diaInicio)} a ${formatDateBR(f.diaFim)}`)
    : (f.periodo==='periodo' && f.diaInicio) ? `A partir de ${formatDateBR(f.diaInicio)}`
    : (f.periodo==='periodo' && f.diaFim) ? `Até ${formatDateBR(f.diaFim)}`
    : f.periodo==='periodo' ? 'Todos (nenhuma data selecionada)'
    : 'Todos os períodos';
  const movLabels = { entrada:'Entradas', saida:'Saídas', transferencia:'Transferências' };
  const movimento = movLabels[f.movimento] || 'Todos';
  const categoria = (f.categoria && f.categoria!=='todos') ? f.categoria : 'Todas';
  const conta = (f.conta && f.conta!=='todos') ? contaNome(f.conta) : 'Todas';
  const fornecedor = (f.fornecedor && f.fornecedor!=='todos') ? f.fornecedor : 'Todos';
  const busca = f.busca ? `“${f.busca}”` : '—';
  const periodoLivre = f.periodo==='todos' || (f.periodo==='periodo' && !f.diaInicio && !f.diaFim);
  const semFiltro = periodoLivre
    && (!f.movimento || f.movimento==='todos')
    && (!f.categoria || f.categoria==='todos')
    && (!f.conta || f.conta==='todos')
    && (!f.fornecedor || f.fornecedor==='todos')
    && !f.busca;
  return {
    semFiltro,
    linhas: [['Período',periodo],['Movimento',movimento],['Categoria',categoria],['Conta',conta],['Fornecedor',fornecedor],['Busca',busca]]
  };
}

let _exclusaoLoteEmAndamento = false;
let _exclusaoLoteFocoAnterior = null;

function _exclusaoLoteEsc(ev){
  if(ev.key==='Escape' && !_exclusaoLoteEmAndamento) fecharExclusaoLote();
}

function fecharExclusaoLote(){
  document.getElementById('bulkDeleteModal').classList.remove('show');
  document.removeEventListener('keydown', _exclusaoLoteEsc);
  document.getElementById('bulkDeleteBody').innerHTML = '';
  if(_exclusaoLoteFocoAnterior && typeof _exclusaoLoteFocoAnterior.focus==='function'){
    try{ _exclusaoLoteFocoAnterior.focus(); }catch(e){}
  }
  _exclusaoLoteFocoAnterior = null;
}

function abrirExclusaoEmLote(){
  atualizarListaLanc();
  const lista = (state.__filtroLancResult || []).slice();
  if(lista.length===0){ toast('Não há lançamentos na lista filtrada para excluir.'); return; }

  const idsAlvo = new Set(lista.map(e=>e.id));
  const entradas = lista.filter(e=>e.movimento==='entrada');
  const saidas = lista.filter(e=>e.movimento==='saida');
  const transferencias = lista.filter(e=>e.movimento==='transferencia');
  const soma = arr => arr.reduce((a,e)=> a + (Number(e.valor)||0), 0);

  const { semFiltro, linhas } = resumoFiltrosLanc();
  const apagaTudo = lista.length === state.entries.length;
  const exigeTudo = semFiltro || apagaTudo;
  const palavra = exigeTudo ? 'EXCLUIR TUDO' : 'EXCLUIR';

  const aviso = exigeTudo ? `
    <div role="alert" style="background:var(--red-soft); color:var(--red); border:1.5px solid var(--red); border-radius:var(--r-sm); padding:12px 14px; font-weight:800; font-size:13px; line-height:1.5; margin:12px 0;">
      ${semFiltro ? 'Nenhum filtro aplicado: isso excluirá TODOS os lançamentos.' : 'Os filtros atuais abrangem todos os lançamentos do sistema: isso excluirá TODOS os lançamentos.'}
    </div>` : '';

  document.getElementById('bulkDeleteBody').innerHTML = `
    <p style="margin:0 0 4px;">Você está prestes a excluir <strong>${lista.length} lançamento(s)</strong> da lista filtrada atual.</p>
    ${aviso}
    <div style="margin-top:10px;">
      <div class="ticket-line"><span class="lbl">Entradas (${entradas.length})</span><span class="dots"></span><span class="val pos">${formatBRL(soma(entradas))}</span></div>
      <div class="ticket-line"><span class="lbl">Saídas (${saidas.length})</span><span class="dots"></span><span class="val neg">${formatBRL(soma(saidas))}</span></div>
      <div class="ticket-line"><span class="lbl">Transferências</span><span class="dots"></span><span class="val">${transferencias.length}</span></div>
      <div class="ticket-line ticket-total"><span class="lbl">Total a excluir</span><span class="dots"></span><span class="val">${lista.length}</span></div>
    </div>
    <div class="mini-note" style="margin-top:14px; font-weight:700; color:var(--ink-soft);">Filtros ativos</div>
    ${linhas.map(([k,v])=>`<div class="mini-note" style="margin:2px 0;">${k}: <strong>${escapeHtml(v)}</strong></div>`).join('')}
    <p style="color:var(--red); font-weight:800; margin:14px 0 10px;">Esta ação não pode ser desfeita.</p>
    <label style="display:flex; gap:8px; align-items:flex-start; cursor:pointer; font-size:13.5px; color:var(--ink-soft); line-height:1.4;">
      <input type="checkbox" id="bulkDeleteBackup" checked style="margin-top:2px;">
      <span>Baixar backup (.json) antes de excluir</span>
    </label>
    <div class="field" style="margin:14px 0 0;">
      <label for="bulkDeleteTexto">Para confirmar, digite <strong>${palavra}</strong></label>
      <input type="text" id="bulkDeleteTexto" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${palavra}">
    </div>
    <div class="mini-note" id="bulkDeleteHint" aria-live="polite" style="min-height:1.2em; margin-top:6px;"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline btn-sm" id="bulkDeleteCancel">Cancelar</button>
      <button type="button" class="btn btn-danger btn-sm" id="bulkDeleteOk" disabled>Excluir ${lista.length} lançamento(s)</button>
    </div>
  `;

  const input = document.getElementById('bulkDeleteTexto');
  const okBtn = document.getElementById('bulkDeleteOk');
  const cancelBtn = document.getElementById('bulkDeleteCancel');
  const chkBackup = document.getElementById('bulkDeleteBackup');
  const hint = document.getElementById('bulkDeleteHint');
  const rotuloOk = okBtn.textContent;

  input.addEventListener('input', ()=>{
    const bate = input.value === palavra;
    okBtn.disabled = !bate;
    hint.textContent = (!bate && input.value) ? `O texto precisa ser exatamente ${palavra}.` : '';
  });
  cancelBtn.addEventListener('click', fecharExclusaoLote);
  okBtn.addEventListener('click', async ()=>{
    if(okBtn.disabled || input.value !== palavra || _exclusaoLoteEmAndamento) return;
    _exclusaoLoteEmAndamento = true;
    okBtn.disabled = true; cancelBtn.disabled = true; input.disabled = true; chkBackup.disabled = true;
    okBtn.textContent = 'Excluindo…';
    let ok = false;
    try{
      ok = await executarExclusaoLote(idsAlvo, chkBackup.checked);
    } finally {
      _exclusaoLoteEmAndamento = false;
    }
    if(ok){
      fecharExclusaoLote();
    } else {
      okBtn.textContent = rotuloOk;
      okBtn.disabled = input.value !== palavra;
      cancelBtn.disabled = false; input.disabled = false; chkBackup.disabled = false;
    }
  });

  _exclusaoLoteFocoAnterior = document.activeElement;
  document.getElementById('bulkDeleteModal').classList.add('show');
  document.removeEventListener('keydown', _exclusaoLoteEsc);
  document.addEventListener('keydown', _exclusaoLoteEsc);
  if(!isMobileViewport()) input.focus();
}

async function executarExclusaoLote(idsAlvo, comBackup){
  if(comBackup){
    const backupOk = await baixarBackupCompleto();
    if(!backupOk){
      toast('Backup não gerado: nada foi excluído. Tente de novo ou desmarque a opção de backup.');
      return false;
    }
  }

  const anterior = state.entries;
  const restantes = anterior.filter(e=> !idsAlvo.has(e.id));
  const removidos = anterior.length - restantes.length;
  state.entries = restantes;

  let gravou = false;
  try{ gravou = await persistEntries(); }
  catch(e){ console.error('Falha ao gravar exclusão em lote:', e); gravou = false; }

  if(gravou !== true){
    state.entries = anterior;
    atualizarListaLanc();
    toast('Não foi possível gravar a exclusão. Nenhum lançamento foi removido. Verifique a conexão e tente de novo.');
    return false;
  }

  toastSuccess(`${removidos} lançamento(s) excluído(s) com sucesso.`);
  atualizarListaLanc();
  const mList = document.getElementById('mLancList');
  if(mList){
    closeOpenSwipeRow();
    mList.innerHTML = buildLancGroupsHTML();
    wireLancRows();
  }
  return true;
}

function atualizarListaLanc(){
  const f = state.filtroLanc;
  let list = state.entries.slice();

  if(f.periodo==='mes'){ list = list.filter(e=> entryMonth(e)===f.mes); }
  else if(f.periodo==='periodo' && (f.diaInicio || f.diaFim)){
    // datas ISO (aaaa-mm-dd) comparam corretamente como texto; extremo vazio = sem limite
    let ini = f.diaInicio, fim = f.diaFim;
    if(ini && fim && ini>fim){ const t = ini; ini = fim; fim = t; }
    list = list.filter(e=> (!ini || e.data>=ini) && (!fim || e.data<=fim));
  }

  if(f.movimento && f.movimento!=='todos'){ list = list.filter(e=>e.movimento===f.movimento); }
  if(f.categoria && f.categoria!=='todos'){ list = list.filter(e=> e.categoria===f.categoria); }
  if(f.conta && f.conta!=='todos'){
    list = list.filter(e=> e.conta===f.conta || e.contaOrigem===f.conta || e.contaDestino===f.conta);
  }
  if(f.fornecedor && f.fornecedor!=='todos'){
    list = list.filter(e=> e.fornecedor===f.fornecedor);
  }
  if(f.busca){
    const termo = f.busca.toLowerCase();
    list = list.filter(e=>
      (e.descricao||'').toLowerCase().includes(termo) ||
      (e.categoria||'').toLowerCase().includes(termo) ||
      (e.fornecedor||'').toLowerCase().includes(termo) ||
      (e.cliente||'').toLowerCase().includes(termo) ||
      (e.formaPagamento||'').toLowerCase().includes(termo)
    );
  }

  list.sort((a,b)=> b.data.localeCompare(a.data));
  state.__filtroLancResult = list;
  atualizarTotalLanc();

  // A tabela/lista abaixo só existe no template desktop (no mobile, a view
  // Lançamentos usa seus próprios cards, lidos de state.__filtroLancResult acima).
  if(!document.getElementById('countInfo')) return;

  document.getElementById('countInfo').textContent = `${list.length} lançamento(s)` + (f.busca ? ` para "${f.busca}"` : '');

  const rows = list.map(e=>{
    const isTransf = e.movimento==='transferencia';
    const movLabel = e.movimento==='entrada' ? '<span class="badge badge-ok">Entrada</span>' : e.movimento==='saida' ? '<span class="badge" style="background:var(--red-soft); color:var(--red);">Saída</span>' : '<span class="badge badge-parc">Transferência</span>';
    const contaLabel = isTransf ? `${contaNome(e.contaOrigem)} → ${contaNome(e.contaDestino)}` : contaPillHTML(e.conta);
    const statusStamp = e.status==='OK' ? '<span class="stamp ok">OK</span>' : e.status==='Aguardando' ? '<span class="stamp wait">Aguardando</span>' : e.status ? `<span class="stamp parc">${e.status}</span>` : '';
    const valClass = e.movimento==='entrada' ? 'pos' : e.movimento==='saida' ? 'neg' : '';
    return `<tr>
      <td class="mono">${formatDateBR(e.data)}</td>
      <td>${movLabel}</td>
      <td>${e.categoria||'—'}</td>
      <td>${e.descricao||''}${e.fornecedor?` <span class="mini-note" style="display:inline;">· ${e.fornecedor}</span>`:''}${e.cliente?` <span class="mini-note" style="display:inline;">· ${e.cliente}</span>`:''}</td>
      <td>${contaLabel}</td>
      <td>${e.formaPagamento||'—'}</td>
      <td>${statusStamp}</td>
      <td class="num val ${valClass}">${formatBRL(e.valor)}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-ghost btn-sm" data-edit="${e.id}" title="Editar">✎</button>
        <button class="btn btn-ghost btn-sm" data-del="${e.id}" title="Excluir" style="color:var(--red);">🗑</button>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('tblLancBody').innerHTML = rows || `<tr><td colspan="9"><div class="empty-state"><div class="ico">🧾</div>Nenhum lançamento encontrado para esse filtro</div></td></tr>`;

  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=> abrirFormLanc(btn.dataset.edit));
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=> excluirLancamento(btn.dataset.del));
  });
}

async function excluirLancamento(id){
  const ok = await confirmDialog('Excluir lançamento?', 'Essa ação não pode ser desfeita.');
  if(!ok) return;
  state.entries = state.entries.filter(e=>e.id!==id);
  await persistEntries();
  toast('Lançamento excluído.');
  atualizarListaLanc();
  atualizarSaldoMiniIfExists();
}

function abrirFormLanc(editId){
  const panel = document.getElementById('formPanel');
  panel.style.display='block';
  document.getElementById('editId').value = editId || '';
  let mov = 'entrada';
  if(editId){
    const e = state.entries.find(x=>x.id===editId);
    if(e) mov = e.movimento;
    document.getElementById('formTitle').textContent = 'Editar lançamento';
  } else {
    document.getElementById('formTitle').textContent = 'Novo lançamento';
  }
  document.querySelectorAll('#movTabs button').forEach(b=> b.classList.toggle('active', b.dataset.mov===mov));
  montarCamposForm(mov, editId);
  if(typeof panel.scrollIntoView === 'function'){
    try{ panel.scrollIntoView({behavior:'smooth', block:'start'}); }catch(e){}
  }
}
